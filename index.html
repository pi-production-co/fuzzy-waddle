<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Task Tracker">
<meta name="theme-color" content="#1F2937">
<title>Task Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#F1F5F9;color:#111827;min-height:100vh;overscroll-behavior:none;}
button,input,textarea,select{font-family:inherit;cursor:pointer;}
input,textarea{cursor:text;}
#app{min-height:100vh;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#install-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:#1F2937;color:#fff;padding:14px 16px;z-index:200;border-top:2px solid #2563EB;align-items:center;gap:12px;}
#install-banner.show{display:flex;}
#install-banner p{flex:1;font-size:13px;line-height:1.4;}
#install-banner p strong{display:block;font-size:14px;margin-bottom:2px;}
#install-btn{background:#2563EB;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;white-space:nowrap;}
#dismiss-btn{background:none;border:1px solid #4B5563;color:#9CA3AF;border-radius:8px;padding:9px 12px;font-size:12px;}
#ios-hint{display:none;position:fixed;bottom:0;left:0;right:0;background:#1F2937;color:#fff;padding:14px 16px 28px;z-index:200;border-top:2px solid #2563EB;}
#ios-hint.show{display:block;}
#ios-hint p{font-size:13px;line-height:1.6;margin-bottom:10px;}
#ios-hint strong{color:#60A5FA;}
#ios-close{background:none;border:1px solid #4B5563;color:#9CA3AF;border-radius:8px;padding:7px 14px;font-size:12px;width:100%;}

/* ── Board ── */
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 80px;}
.wrap.wide{max-width:none;padding:14px 14px 40px;}
.toolbar{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.toolbar input[type=search]{flex:1;min-width:140px;border:1.5px solid #E5E7EB;border-radius:8px;padding:7px 10px;font-size:13px;outline:none;}
.toolbar select{border:1.5px solid #E5E7EB;border-radius:8px;padding:6px 8px;font-size:12px;background:#fff;color:#374151;font-weight:600;}
.seg{display:inline-flex;background:#F1F5F9;border-radius:8px;padding:2px;}
.seg button{border:none;background:transparent;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#6B7280;}
.seg button.on{background:#fff;color:#111827;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.stat{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:8px 12px;min-width:84px;flex:1;}
.stat b{display:block;font-size:20px;font-weight:800;}
.stat span{font-size:11px;color:#6B7280;font-weight:600;}
.nudge{background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:10px;padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:#1E40AF;}
.nudge button{margin-left:auto;background:#2563EB;color:#fff;border:none;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap;}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;align-items:flex-start;}
.col{flex:1 0 250px;min-width:250px;background:#E9EEF4;border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 230px);min-height:200px;scroll-snap-align:start;border:2px solid transparent;transition:border-color .15s,background .15s;}
.col.over{border-color:#2563EB;background:#DBEAFE;}
.col-head{padding:10px 12px 6px;display:flex;align-items:baseline;gap:8px;}
.col-head h2{font-size:13px;font-weight:800;color:#1F2937;letter-spacing:.02em;text-transform:uppercase;}
.col-head .n{font-size:11px;font-weight:800;color:#475569;background:#fff;border-radius:99px;padding:1px 8px;}
.col-hint{font-size:11px;color:#64748B;padding:0 12px 6px;}
.qa{padding:0 8px 8px;}
.qa input{width:100%;border:1.5px dashed #CBD5E1;background:#F8FAFC;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
.qa input:focus{border-style:solid;border-color:#2563EB;background:#fff;}
.col-body{overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:7px;flex:1;}
.empty{font-size:12px;color:#94A3B8;text-align:center;padding:16px 6px;font-style:italic;}
.card{background:#fff;border-radius:9px;border:1px solid #E2E8F0;border-left:4px solid var(--cat,#94A3B8);padding:9px 10px 8px;box-shadow:0 1px 2px rgba(15,23,42,.05);cursor:grab;position:relative;}
.card:hover{box-shadow:0 3px 8px rgba(15,23,42,.1);}
.card.dragging{opacity:.4;}
.card.overdue{background:#FFF7F7;}
.card.done{opacity:.6;}
.card-top{display:flex;gap:8px;align-items:flex-start;}
.chk{width:18px;height:18px;border-radius:5px;border:2px solid #CBD5E1;background:#fff;flex-shrink:0;margin-top:1px;font-size:11px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
.chk.on{background:#16A34A;border-color:#16A34A;}
.title{font-size:13.5px;font-weight:600;line-height:1.35;word-break:break-word;flex:1;}
.card.done .title{text-decoration:line-through;color:#94A3B8;font-weight:500;}
.meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px;padding-left:26px;}
.pill{font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;white-space:nowrap;}
.sub{font-size:11.5px;color:#64748B;margin-top:4px;padding-left:26px;line-height:1.4;word-break:break-word;}
.mv{display:none;position:absolute;right:6px;bottom:6px;gap:3px;}
.mv button{border:1px solid #E2E8F0;background:#fff;border-radius:6px;width:24px;height:22px;font-size:12px;color:#475569;line-height:1;}
.card:hover .mv{display:flex;}
@media (hover:none){.mv{display:flex;position:static;justify-content:flex-end;margin-top:6px;}.mv button{width:34px;height:28px;font-size:14px;}}
/* Rows layout: each lane is a horizontal band, cards flow left → right */
.board.rows{flex-direction:column;overflow:visible;scroll-snap-type:none;gap:10px;align-items:stretch;}
.board.rows .col{flex:none;width:100%;min-width:0;max-height:none;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start;}
.board.rows .col-side{padding-bottom:8px;}
.board.rows .col-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));overflow:visible;padding:10px 10px 10px 0;align-content:start;min-height:70px;}
.board.rows .col-body>.empty,.board.rows .col-body>.show-more{grid-column:1/-1;}
.board.rows .empty{text-align:left;padding:14px 4px;}
.col.collapsed .col-hint,.col.collapsed .qa{display:none;}
.col.collapsed .col-body{display:none!important;}
.col.collapsed{min-height:0!important;}
.tog{border:none;background:none;color:#64748B;font-size:12px;font-weight:800;padding:0 2px;width:18px;}
.show-more{border:none;background:none;color:#2563EB;font-size:12px;font-weight:700;padding:6px;}
/* Drag to reorder */
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.ph{border:2px dashed #2563EB;background:rgba(37,99,235,.06);border-radius:9px;min-height:44px;}
.col-body:has(.ph)>.empty{display:none;}
.ghost{position:fixed;left:0;top:0;z-index:400;pointer-events:none;box-shadow:0 12px 28px rgba(15,23,42,.28)!important;opacity:.95;cursor:grabbing;}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;}
@media (max-width:640px){.board:not(.rows) .col{flex:0 0 86vw;max-height:calc(100vh - 250px);}.board.rows .col{grid-template-columns:1fr;}.board.rows .col-body{padding:0 8px 10px;grid-template-columns:1fr;}.board.rows .col-side{padding-bottom:4px;}.stat{min-width:70px;padding:7px 10px;}.stat b{font-size:17px;}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2937;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.25);}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6B7280;font-size:14px;">Loading…</div></div>
<div id="install-banner">
  <p><strong>📲 Install Task Tracker</strong>Add to your home screen for quick access</p>
  <button id="dismiss-btn" onclick="dismissInstall()">Later</button>
  <button id="install-btn" onclick="triggerInstall()">Install</button>
</div>
<div id="ios-hint">
  <p>To install on iPhone: tap the <strong>Share button ↑</strong> in Safari, then tap <strong>"Add to Home Screen"</strong>.</p>
  <button id="ios-close">Got it</button>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// ── Storage ────────────────────────────────────────────────────────────────────
const ls={
  get(k){try{return localStorage.getItem(k);}catch{return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch{}},
  del(k){try{localStorage.removeItem(k);}catch{}},
};

// ── PWA Install ────────────────────────────────────────────────────────────────
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!ls.get('pwa-dismissed'))document.getElementById('install-banner').classList.add('show');});
function triggerInstall(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('install-banner').classList.remove('show');});}}
function dismissInstall(){document.getElementById('install-banner').classList.remove('show');ls.set('pwa-dismissed','1');}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone;
if(isIOS&&!isStandalone&&!ls.get('ios-hint-dismissed')){
  setTimeout(()=>document.getElementById('ios-hint').classList.add('show'),2500);
  document.getElementById('ios-close').onclick=()=>{document.getElementById('ios-hint').classList.remove('show');ls.set('ios-hint-dismissed','1');};
}

// ── Dates (local time, not UTC) ────────────────────────────────────────────────
function localDateStr(d=new Date()){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseLocal(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseLocal(s);d.setDate(d.getDate()+n);return localDateStr(d);}
function addMonths(s,n){const d=parseLocal(s);d.setMonth(d.getMonth()+n);return localDateStr(d);}
const todayStr=localDateStr();

// ── Constants ──────────────────────────────────────────────────────────────────
const CATEGORIES=["Service Calendar","Subcontractor","Large Project","Materials/Orders","Customer Follow-up","PM Check-in","Admin","Marketing"];
const PRIORITIES=["High","Medium","Low"];
const STATUSES=["Not Started","In Progress","Waiting","Blocked","Complete"];
const PM_HEALTH=["On Track","At Risk","Delayed","On Hold","Complete"];
const LANES=[
  {id:'backlog',label:'Backlog',hint:'Put it down and leave it here'},
  {id:'week',label:'This Week',hint:'Getting done this week'},
  {id:'today',label:'Today',hint:'What you’re working on today'},
  {id:'waiting',label:'Waiting',hint:'Waiting on a sub, supplier, customer or PM'},
  {id:'done',label:'Done',hint:''},
];
const LANE_IDS=LANES.map(l=>l.id);
const laneLabel=id=>(LANES.find(l=>l.id===id)||{}).label||id;
const REPEATS=[{id:'none',label:'Does not repeat'},{id:'daily',label:'Every day'},{id:'weekdays',label:'Every weekday'},{id:'weekly',label:'Every week'},{id:'monthly',label:'Every month'}];
const REPEAT_IDS=REPEATS.map(r=>r.id);
const CAT_COLORS={"Service Calendar":{bg:"#DBEAFE",text:"#1D4ED8",dot:"#3B82F6"},"Subcontractor":{bg:"#F3E8FF",text:"#7E22CE",dot:"#A855F7"},"Large Project":{bg:"#FFEDD5",text:"#C2410C",dot:"#F97316"},"Materials/Orders":{bg:"#DCFCE7",text:"#15803D",dot:"#22C55E"},"Customer Follow-up":{bg:"#FEF9C3",text:"#A16207",dot:"#EAB308"},"PM Check-in":{bg:"#FCE7F3",text:"#BE185D",dot:"#EC4899"},"Admin":{bg:"#F1F5F9",text:"#475569",dot:"#94A3B8"},"Marketing":{bg:"#CCFBF1",text:"#0F766E",dot:"#14B8A6"}};
const PRI_COLORS={High:{bg:"#FEE2E2",text:"#B91C1C"},Medium:{bg:"#FEF9C3",text:"#A16207"},Low:{bg:"#DCFCE7",text:"#15803D"}};
const STATUS_COLORS={"Not Started":{bg:"#F1F5F9",text:"#475569"},"In Progress":{bg:"#DBEAFE",text:"#1D4ED8"},"Waiting":{bg:"#FEF9C3",text:"#A16207"},"Blocked":{bg:"#FEE2E2",text:"#B91C1C"},"Complete":{bg:"#DCFCE7",text:"#15803D"}};
const HEALTH_COLORS={"On Track":{bg:"#DCFCE7",text:"#15803D",icon:"🟢"},"At Risk":{bg:"#FEF9C3",text:"#A16207",icon:"🟡"},"Delayed":{bg:"#FEE2E2",text:"#B91C1C",icon:"🔴"},"On Hold":{bg:"#F1F5F9",text:"#475569",icon:"⏸"},"Complete":{bg:"#DCFCE7",text:"#15803D",icon:"✅"}};
const ASANA_API="https://app.asana.com/api/1.0";
const SCOPES='https://www.googleapis.com/auth/spreadsheets';
const AUTOPUSH_DELAY=8000;
const TASK_RANGE="'Daily Tasks'!A5:N500";

const SAMPLE_TASKS=[
  {id:1,category:"Service Calendar",description:"Call back Mrs. Thompson re: quote",job:"Thompson",priority:"High",dueDate:todayStr,status:"In Progress",notes:"Left voicemail — try again after 2pm",done:false,lane:'today'},
  {id:2,category:"Materials/Orders",description:"Confirm delivery date for Job #3847",job:"Brennan Project",priority:"High",dueDate:todayStr,status:"Not Started",notes:"",done:false,lane:'today'},
  {id:3,category:"PM Check-in",description:"Weekly check-in with PMs",job:"",priority:"Medium",dueDate:addDays(todayStr,2),status:"Not Started",notes:"",done:false,lane:'week',repeat:'weekly'},
  {id:4,category:"Large Project",description:"Review change order for Project Delta",job:"Delta / COM-0042",priority:"Low",dueDate:"",status:"Waiting",notes:"Awaiting revised scope from PM",done:false,lane:'waiting'},
  {id:5,category:"Marketing",description:"Pull next neighborhood target list",job:"",priority:"Low",dueDate:"",status:"Not Started",notes:"",done:false,lane:'backlog'},
];
const SAMPLE_PROJECTS=[];
const SAMPLE_PARKING=[];

// ── Helpers ────────────────────────────────────────────────────────────────────
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function isOverdue(due,status){return !!due&&status!=='Complete'&&due<todayStr;}
function daysLeft(d){if(!d)return null;return Math.round((parseLocal(d)-parseLocal(todayStr))/86400000);}
function nowTime(){return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${m}/${day}/${y}`;}
function fmtShort(d){if(!d)return'';const n=daysLeft(d);if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'Yesterday';const dt=parseLocal(d);const wd=dt.toLocaleDateString('en-US',{weekday:'short'});return(n>1&&n<7)?wd:`${wd} ${dt.getMonth()+1}/${dt.getDate()}`;}
function badge(label,colors,size='sm'){const p=size==='sm'?'2px 8px':'3px 10px';const fs=size==='sm'?'11px':'12px';return`<span style="background:${colors.bg};color:${colors.text};border-radius:99px;padding:${p};font-size:${fs};font-weight:600;white-space:nowrap;display:inline-block;">${esc(label)}</span>`;}
function fi(label,name,val='',type='text',ph=''){const s='width:100%;border:1.5px solid #D1D5DB;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;';const inp=type==='textarea'?`<textarea name="${name}" rows="2" placeholder="${esc(ph)}" style="${s}resize:vertical;">${esc(val)}</textarea>`:`<input type="${type}" name="${name}" value="${esc(val)}" placeholder="${esc(ph)}" style="${s}">`;return`<div style="margin-bottom:12px;"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px;">${label}</label>${inp}</div>`;}
function sel(name,opts,val){return`<select name="${name}" style="width:100%;border:1.5px solid #D1D5DB;border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;outline:none;">${opts.map(o=>{const v=typeof o==='string'?o:o.id;const l=typeof o==='string'?o:o.label;return`<option value="${esc(v)}"${v===val?' selected':''}>${esc(l)}</option>`;}).join('')}</select>`;}
function lbl(t){return`<label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px;">${t}</label>`;}
function modal(content){return`<div onclick="handleModalBg(event)" style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;"><div id="modal-sheet" onclick="event.stopPropagation()" style="background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:20px 18px 36px;">${content}</div></div>`;}

// ── Lanes: keep board column, status and done flag consistent ──────────────────
function laneForDue(d){if(!d)return'backlog';if(d<=todayStr)return'today';if(d<=addDays(todayStr,6))return'week';return'backlog';}
function deriveLane(t){
  if(t.done||t.status==='Complete')return'done';
  if(t.status==='Waiting'||t.status==='Blocked')return'waiting';
  if(t.status==='In Progress')return'today';
  return laneForDue(t.dueDate);
}
function normalizeTask(src){
  const t={...src};
  if(!CATEGORIES.includes(t.category))t.category=t.category||'Admin';
  if(!PRIORITIES.includes(t.priority))t.priority='Medium';
  if(!STATUSES.includes(t.status))t.status='Not Started';
  if(!REPEAT_IDS.includes(t.repeat))t.repeat='none';
  if(!LANE_IDS.includes(t.lane))t.lane=deriveLane(t);
  if(t.done||t.status==='Complete'){t.done=true;t.status='Complete';t.lane='done';t.completedAt=t.completedAt||todayStr;}
  else if(t.lane==='done'){t.lane=deriveLane({...t,lane:undefined});}
  if(t.lane!=='done'){t.done=false;t.completedAt=null;}
  if(t.asanaGid===undefined)t.asanaGid=null;
  return t;
}
function normalizeAll(arr){return assignOrders((arr||[]).map(normalizeTask));}
// ── Manual card order within a lane ────────────────────────────────────────────
const PRI_ORD={High:0,Medium:1,Low:2};
function autoSort(arr){
  return arr.slice().sort((a,b)=>{
    const oa=isOverdue(a.dueDate,a.status)?0:1,ob=isOverdue(b.dueDate,b.status)?0:1;if(oa!==ob)return oa-ob;
    const p=(PRI_ORD[a.priority]??1)-(PRI_ORD[b.priority]??1);if(p)return p;
    const da=a.dueDate||'9999',db=b.dueDate||'9999';if(da!==db)return da<db?-1:1;
    return String(a.description).localeCompare(String(b.description));
  });
}
const hasOrder=t=>typeof t.order==='number'&&isFinite(t.order);
// Cards without a saved position (older cards, cards added in the Sheet) get one, in the old auto-sort order
function assignOrders(tasks){
  const byLane={};tasks.forEach(t=>{(byLane[t.lane]=byLane[t.lane]||[]).push(t);});
  Object.values(byLane).forEach(arr=>{
    const missing=arr.filter(t=>!hasOrder(t));if(!missing.length)return;
    let max=Math.max(0,...arr.filter(hasOrder).map(t=>t.order));
    autoSort(missing).forEach(t=>{max+=1000;t.order=max;});
  });
  return tasks;
}
function laneTasks(lane,excludeId){return state.tasks.filter(t=>t.lane===lane&&String(t.id)!==String(excludeId));}
function topOrder(lane,excludeId){const o=laneTasks(lane,excludeId).filter(hasOrder).map(t=>t.order);return o.length?Math.min(...o)-1000:1000;}
function renumberLane(lane){laneTasks(lane).sort((a,b)=>a.order-b.order).forEach((t,i)=>{t.order=(i+1)*1000;});}
// Order value for dropping card `id` at position `index` of the lane as currently shown (respects filters)
function orderAt(lane,id,index){
  if(lane==='done'||index==null)return topOrder(lane,id);
  const calc=()=>{
    const list=sortLane(lane,laneTasks(lane,id).filter(matches));
    const before=list[index-1],after=list[index];
    if(!before&&!after)return{v:topOrder(lane,id)};
    if(!before)return{v:after.order-1000};
    if(!after)return{v:before.order+1000};
    return{v:(before.order+after.order)/2,gap:after.order-before.order};
  };
  let r=calc();
  if(r.gap!==undefined&&r.gap<0.001){renumberLane(lane);r=calc();}
  return r.v;
}
function applyLane(t,lane){
  const u={...t,lane};
  if(lane==='done'){u.done=true;u.status='Complete';u.completedAt=t.completedAt||todayStr;return u;}
  if(t.done){u.done=false;u.completedAt=null;u.status='Not Started';}
  if(lane==='waiting'){if(u.status!=='Waiting'&&u.status!=='Blocked')u.status='Waiting';}
  else if(u.status==='Waiting'||u.status==='Blocked')u.status='Not Started';
  return u;
}
// Repeating cards: when one is finished, the next one is created automatically
function nextDue(base,rep){
  if(!REPEAT_IDS.includes(rep)||rep==='none')return null;
  const step=x=>{if(rep==='daily')return addDays(x,1);if(rep==='weekly')return addDays(x,7);if(rep==='monthly')return addMonths(x,1);let y=addDays(x,1);while([0,6].includes(parseLocal(y).getDay()))y=addDays(y,1);return y;};
  let n=base||todayStr,guard=0;
  do{n=step(n);guard++;}while(n<=todayStr&&guard<1000);
  return n;
}
function spawnRepeat(t){
  if(!t.repeat||t.repeat==='none'||t.spawnedNext)return null;
  const due=nextDue(t.dueDate,t.repeat);if(!due)return null;
  return normalizeTask({id:uid(),category:t.category,description:t.description,job:t.job,priority:t.priority,dueDate:due,status:'Not Started',notes:t.notes,done:false,repeat:t.repeat,lane:laneForDue(due),asanaGid:null});
}

let tokenClient=null,accessToken=null,tokenExpiry=0;
function getClientId(){return ls.get('tt_clientid')||'';}
function getSheetId(){return ls.get('tt_sheetid')||'';}
function isSheetsConfigured(){return getClientId().length>0&&getSheetId().length>0;}
function isAuthenticated(){return accessToken&&Date.now()<tokenExpiry;}

function initTokenClient(){
  const clientId=getClientId();
  if(!clientId||!window.google)return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:clientId,scope:SCOPES,
    callback:(resp)=>{
      if(resp.error){setState({syncStatus:'error',syncMsg:'Sign-in failed: '+resp.error});return;}
      accessToken=resp.access_token;
      tokenExpiry=Date.now()+(resp.expires_in-60)*1000;
      ls.set('tt_authed','1');
      setState({syncStatus:'syncing',syncMsg:'Signed in — syncing…'});
      pushToSheets(state.tasks,state.projects,state.parking).then(merged=>{
        applySync({tasks:merged,syncStatus:'success',syncMsg:'Synced to Google Sheets ✓'});
        setTimeout(()=>setState({syncStatus:null,syncMsg:''}),3000);
      }).catch(e=>setState({syncStatus:'error',syncMsg:'Sync failed: '+e.message}));
    },
  });
}

async function ensureToken(){
  if(isAuthenticated())return;
  return new Promise((resolve,reject)=>{
    if(!tokenClient)initTokenClient();
    if(!tokenClient){reject(new Error('OAuth not configured'));return;}
    const orig=tokenClient.callback;
    tokenClient.callback=(resp)=>{orig(resp);if(resp.error)reject(new Error(resp.error));else resolve();};
    tokenClient.requestAccessToken({prompt:accessToken?'none':'consent'});
  });
}

async function sheetsReq(method,path,body){
  await ensureToken();
  const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${getSheetId()}${path}`,{
    method,headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined,
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'Sheets error');}
  return method==='POST'&&path.includes('clear')?{}:res.json();
}

function parseSheetDate(v){if(!v)return'';const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;return'';}
// Columns A–K are unchanged from v7. L = Board Column, M = Repeats (new in v8).
function tasksToRows(t){return t.map((t,i)=>[i+1,t.category||'',t.description||'',t.job||'','You',t.priority||'',t.dueDate?fmtDate(t.dueDate):'',t.status||'',t.notes||'',t.done?'✅':'',String(t.id||''),laneLabel(t.lane),t.repeat&&t.repeat!=='none'?t.repeat:'',hasOrder(t)?Math.round(t.order*1000)/1000:'']);}
function laneFromLabel(v){const s=String(v||'').trim().toLowerCase();const l=LANES.find(x=>x.label.toLowerCase()===s||x.id===s);return l?l.id:'';}
function rowsToTasks(rows){return rows.filter(r=>r[2]&&String(r[2]).trim()).map((r,i)=>{const rawId=r[10]&&String(r[10]).trim();const done=r[9]==='✅'||r[7]==='Complete';return{id:rawId||('n'+Date.now()+'_'+i),_noId:!rawId,category:r[1]||'Admin',description:r[2]||'',job:r[3]||'',priority:r[5]||'Medium',dueDate:parseSheetDate(r[6]),status:r[7]||'Not Started',notes:r[8]||'',done,completedAt:done?parseSheetDate(r[6])||todayStr:null,asanaGid:null,lane:laneFromLabel(r[11]),repeat:String(r[12]||'').trim().toLowerCase(),order:sheetNum(r[13])};});}
function sheetNum(v){if(v===undefined||v===null||String(v).trim()==='')return undefined;const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:undefined;}
function projectsToRows(p){return p.map(p=>[p.name||'',p.pm||'',p.jobNum||'',p.startDate?fmtDate(p.startDate):'',p.targetEnd?fmtDate(p.targetEnd):'',(p.pctComplete||0)+'%',p.health||'On Track','','',p.blockers||'',p.lastCheckin?fmtDate(p.lastCheckin):'']);}
function rowsToProjects(rows){return rows.filter(r=>r[0]&&r[0].trim()).map((r,i)=>({id:Date.now()+i,name:r[0]||'',pm:r[1]||'',jobNum:r[2]||'',startDate:parseSheetDate(r[3]),targetEnd:parseSheetDate(r[4]),pctComplete:parseInt((r[5]||'0').replace('%',''))||0,health:r[6]||'On Track',blockers:r[9]||'',lastCheckin:parseSheetDate(r[10])||todayStr}));}
function parkingToRows(p){return p.map(p=>[p.time||'',p.wasWorkingOn||'',p.interruption||'',p.nextStep||'',p.priority||'Medium',p.cleared?'✅ Cleared':'⏳ Pending']);}
function rowsToParking(rows){return rows.filter(r=>r[1]&&r[1].trim()).map((r,i)=>({id:Date.now()+i,time:r[0]||'',wasWorkingOn:r[1]||'',interruption:r[2]||'',nextStep:r[3]||'',priority:r[4]||'Medium',cleared:r[5]==='✅ Cleared'}));}

async function pushToSheets(tasks,projects,parking){
  // Cloud mode: the Sheet is a one-way copy of the cloud data (no merging back)
  const oneWay=cloudOn();
  let merged;
  if(oneWay){merged=tasks;}
  else{
    // Read current sheet tasks so direct-in-sheet additions are preserved (merge, not overwrite)
    let sheetTasks=[];
    try{const tR=await sheetsReq('GET',`/values/${TASK_RANGE}`);sheetTasks=rowsToTasks(tR.values||[]);}catch(e){}
    sheetTasks=reconcileIds(tasks,sheetTasks);
    merged=normalizeAll(mergeForPush(tasks,sheetTasks));
  }
  await sheetsReq('POST',`/values/${TASK_RANGE}:clear`);
  if(merged.length)await sheetsReq('PUT',`/values/'Daily Tasks'!A5?valueInputOption=USER_ENTERED`,{range:"'Daily Tasks'!A5",majorDimension:'ROWS',values:tasksToRows(merged)});
  await ensureTaskHeaders();
  await sheetsReq('POST',`/values/'PM Status'!A7:K50:clear`);
  if(projects.length)await sheetsReq('PUT',`/values/'PM Status'!A7?valueInputOption=USER_ENTERED`,{range:"'PM Status'!A7",majorDimension:'ROWS',values:projectsToRows(projects)});
  await sheetsReq('POST',`/values/'Parking Lot'!A8:F50:clear`);
  if(parking.length)await sheetsReq('PUT',`/values/'Parking Lot'!A8?valueInputOption=USER_ENTERED`,{range:"'Parking Lot'!A8",majorDimension:'ROWS',values:parkingToRows(parking)});
  // Append completed tasks to the permanent, append-only Completed Log (never cleared)
  try{
    let forLog=merged;
    if(oneWay){const m=new Map();(await cloudCompletedLog()).forEach(t=>m.set(String(t.id),t));merged.forEach(t=>m.set(String(t.id),t));forLog=[...m.values()];}
    await appendCompletedLog(forLog);
  }catch(e){}
  return merged;
}

// ── Merge + history helpers ────────────────────────────────────────────────────
function getTombstones(){try{return JSON.parse(ls.get('tt_deleted')||'[]');}catch{return[];}}
function addTombstone(id){const now=Date.now();const t=getTombstones().filter(x=>now-x.ts<60*86400000);t.push({id:String(id),ts:now});ls.set('tt_deleted',JSON.stringify(t));}
function tombstonedIds(){return new Set(getTombstones().map(x=>String(x.id)));}
function indexById(arr){const m=new Map();arr.forEach(t=>m.set(String(t.id),t));return m;}
// Migration: sheet rows without a stored ID get matched to existing app tasks by description+job
function reconcileIds(appTasks,sheetTasks){
  const used=new Set();const norm=v=>String(v||'').trim().toLowerCase();
  sheetTasks.forEach(s=>{
    if(s._noId){
      const m=appTasks.find(a=>!used.has(String(a.id))&&norm(a.description)===norm(s.description)&&norm(a.job)===norm(s.job));
      if(m){s.id=m.id;used.add(String(m.id));}
    }
    delete s._noId;
  });
  return sheetTasks;
}
// Push: app wins on conflict; sheet-only additions kept; app-deleted (tombstoned) removed
function mergeForPush(appTasks,sheetTasks){
  const tomb=tombstonedIds();const appIdx=indexById(appTasks);const out=[];
  appTasks.forEach(t=>{if(!tomb.has(String(t.id)))out.push(t);});
  sheetTasks.forEach(s=>{const id=String(s.id);if(!appIdx.has(id)&&!tomb.has(id))out.push(s);});
  return out;
}
// Pull: sheet wins on conflict, but app-only fields (Asana link, repeat bookkeeping) are kept
function mergeForPull(appTasks,sheetTasks){
  const tomb=tombstonedIds();const shIdx=indexById(sheetTasks);const appIdx=indexById(appTasks);const out=[];
  sheetTasks.forEach(s=>{
    const id=String(s.id);if(tomb.has(id))return;
    const a=appIdx.get(id);
    out.push(a?{...a,...s,lane:s.lane||a.lane,repeat:s.repeat||a.repeat,order:hasOrder(s)?s.order:a.order,asanaGid:a.asanaGid||null}:s);
  });
  appTasks.forEach(t=>{const id=String(t.id);if(!shIdx.has(id)&&!tomb.has(id))out.push(t);});
  return out;
}

async function ensureCompletedLog(){

  const titles=(meta.sheets||[]).map(s=>s.properties.title);
  if(titles.includes('Completed Log'))return;
  await sheetsReq('POST',`:batchUpdate`,{requests:[{addSheet:{properties:{title:'Completed Log'}}}]});
  await sheetsReq('PUT',`/values/'Completed Log'!A1?valueInputOption=USER_ENTERED`,{range:"'Completed Log'!A1",majorDimension:'ROWS',values:[['Completed Date','Task','Category','Job / Customer','Priority','Notes','Task ID']]});
}
async function appendCompletedLog(tasks){
  const done=tasks.filter(t=>t.done||t.status==='Complete');
  if(!done.length)return;
  await ensureCompletedLog();
  const existing=new Set();
  try{const r=await sheetsReq('GET',`/values/'Completed Log'!G2:G100000`);(r.values||[]).forEach(row=>{if(row[0])existing.add(String(row[0]).trim());});}catch(e){}
  const add=done.filter(t=>!existing.has(String(t.id)));
  if(!add.length)return;
  const rows=add.map(t=>[t.completedAt?fmtDate(t.completedAt):fmtDate(todayStr),t.description||'',t.category||'',t.job||'',t.priority||'',t.notes||'',String(t.id||'')]);
  await sheetsReq('POST',`/values/'Completed Log'!A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,{range:"'Completed Log'!A1",majorDimension:'ROWS',values:rows});
}

async function pullFromSheets(appTasks){
  const[tR,pR,kR]=await Promise.all([sheetsReq('GET',`/values/${TASK_RANGE}`),sheetsReq('GET',`/values/'PM Status'!A7:K50`),sheetsReq('GET',`/values/'Parking Lot'!A8:F50`)]);
  let sheetTasks=reconcileIds(appTasks||[],rowsToTasks(tR.values||[]));
  const mergedTasks=normalizeAll(mergeForPull(appTasks||[],sheetTasks));
  return{tasks:mergedTasks,projects:rowsToProjects(pR.values||[]),parking:rowsToParking(kR.values||[])};

async function asanaReq(method,path,body){
  const pat=getAsanaPAT();
  if(!pat)throw new Error('Asana not configured');
  const res=await fetch(`${ASANA_API}${path}`,{
    method,
    headers:{'Authorization':'Bearer '+pat,'Content-Type':'application/json','Accept':'application/json'},
    body:body?JSON.stringify({data:body}):undefined,
  });
  if(!res.ok){const e=await res.json();throw new Error(e.errors?.[0]?.message||'Asana API error');}

function taskToAsana(task){
  const notes=[task.notes,task.job?`Job/Customer: ${task.job}`:'',`Category: ${task.category}`,`Board: ${laneLabel(task.lane)}`].filter(Boolean).join('\n');
  const obj={name:task.description,notes,completed:task.done||task.status==='Complete',projects:[getAsanaProject()]};
  if(task.dueDate)obj.due_on=task.dueDate;
  return obj;
}
async function pushToAsana(tasks){
  const project=getAsanaProject();
  if(!project)throw new Error('No Asana project configured');
  const updatedTasks=[];
  for(const task of tasks){
    const asanaData=taskToAsana(task);
    try{
      if(task.asanaGid){
        await asanaReq('PUT',`/tasks/${task.asanaGid}`,{name:asanaData.name,notes:asanaData.notes,completed:asanaData.completed,due_on:asanaData.due_on||null});
        updatedTasks.push({...task});
      }else{
        const res=await asanaReq('POST','/tasks',asanaData);
        updatedTasks.push({...task,asanaGid:res.data?.gid||null});
      }
    }catch(e){
      if(task.asanaGid&&e.message.includes('Not Found')){
        const res=await asanaReq('POST','/tasks',asanaData);
        updatedTasks.push({...task,asanaGid:res.data?.gid||null});
      }else updatedTasks.push({...task});
    }
  }
  return updatedTasks;
}

function cloudOn(){return !!(cloud.user&&cloud.ready);}
function stableStr(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return'['+v.map(stableStr).join(',')+']';return'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';}
function cleanDoc(x){const o=JSON.parse(JSON.stringify(x));o.id=String(x.id);return o;} // Firestore can't store undefined
function collRef(c){return cloud.base.collection(c);}
async function commitOps(ops){
  // Firestore batches max out at 500 writes; chunk to be safe
  for(let i=0;i<ops.length;i+=400){
    const b=cloud.db.batch();
    ops.slice(i,i+400).forEach(([kind,ref,data])=>kind==='set'?b.set(ref,data):b.delete(ref));
    cloud.pending++;renderSoon();
    try{await b.commit();cloud.error='';}
    catch(e){cloud.error=e.message||String(e);console.warn('Cloud save failed',e);}
    finally{cloud.pending--;renderSoon();}
  }
}
function logEntry(t){return{id:String(t.id),description:t.description||'',category:t.category||'',job:t.job||'',priority:t.priority||'',notes:t.notes||'',completedAt:t.completedAt||todayStr,done:true,status:'Complete'};}
// Compare current state to what the cloud last had and write only the differences
function cloudWrite(){
  if(!cloudOn())return;
  const ops=[];
  COLLS.forEach(c=>{
    const cur=new Map(state[c].map(x=>{const d=cleanDoc(x);return[d.id,d];}));
    const prev=cloud.synced[c];
    const next=new Map();
    cur.forEach((d,id)=>{const s=stableStr(d);next.set(id,s);if(prev.get(id)!==s)ops.push(['set',collRef(c).doc(id),d]);});
    prev.forEach((_,id)=>{if(!cur.has(id))ops.push(['delete',collRef(c).doc(id)]);});
    cloud.synced[c]=next;
  });
  state.tasks.forEach(t=>{const id=String(t.id);if(t.done&&!cloud.logged.has(id)){cloud.logged.add(id);ops.push(['set',collRef('completedLog').doc(id),logEntry(t)]);}});
  if(ops.length)commitOps(ops);
}
async function cloudCompletedLog(){if(!cloudOn())return[];try{const s=await collRef('completedLog').get();return s.docs.map(d=>d.data());}catch{return[];}}
const byIdDesc=(a,b)=>{const na=Number(a.id),nb=Number(b.id);return(isFinite(nb)&&isFinite(na))?nb-na:String(b.id).localeCompare(String(a.id));};
function applyRemote(c,snap){
  let items=snap.docs.map(d=>d.data());
  cloud.synced[c]=new Map(items.map(x=>[String(x.id),stableStr(cleanDoc(x))]));
  if(c==='tasks')items=normalizeAll(items);else items.sort(byIdDesc);
  state[c]=items;
  cloud.loaded[c]=true;
  if(!cloud.ready&&COLLS.every(k=>cloud.loaded[k])){cloud.ready=true;}
  persist();
  if(cloud.ready)cloudWrite(); // pushes anything normalization changed (e.g. card positions)
  renderSoon(true);
}

let autoPushTimer=null;
function scheduleAutoPush(){
  if(!isSheetsConfigured()||!ls.get('tt_authed'))return;
  clearTimeout(autoPushTimer);
  autoPushTimer=setTimeout(async()=>{
    setState({syncStatus:'syncing',syncMsg:'Auto-saving to Sheets…'});
    try{
      const merged=await pushToSheets(state.tasks,state.projects,state.parking);
      applySync({tasks:merged,syncStatus:'success',syncMsg:'Auto-saved ✓'});
      setTimeout(()=>setState({syncStatus:null,syncMsg:''}),2500);
    }catch(e){setState({syncStatus:null,syncMsg:''});}
  },AUTOPUSH_DELAY);
}
function persist(){
  ls.set('tt_tasks',JSON.stringify(state.tasks));
  ls.set('tt_projects',JSON.stringify(state.projects));
  ls.set('tt_parking',JSON.stringify(state.parking));
}
// Apply sync results (saves + renders) WITHOUT scheduling another auto-push, avoiding loops
function applySync(updates){
  if(updates.tasks)updates.tasks=normalizeAll(updates.tasks);
  Object.assign(state,updates);
  persist();
  if(updates.tasks||updates.projects||updates.parking)cloudWrite();
  render();
}

// ── State ──────────────────────────────────────────────────────────────────────
function loadJSON(k,fallback){try{return JSON.parse(ls.get(k)||'null')||fallback;}catch{return fallback;}}
let state={
  tab:'tasks',
  layout:ls.get('tt_layout')||'rows',
  collapsed:loadJSON('tt_collapsed',{}),
  focus:ls.get('tt_focus')||'all',
  tasks:normalizeAll(loadJSON('tt_tasks',SAMPLE_TASKS.map(t=>({...t,sample:true})))),
  projects:loadJSON('tt_projects',SAMPLE_PROJECTS),
  parking:loadJSON('tt_parking',SAMPLE_PARKING),
  modal:null,filterCat:'All',search:'',pmShowCompleted:{},doneShowAll:false,
  syncStatus:null,syncMsg:'',
  asanaSyncStatus:null,asanaSyncMsg:'',
  showSettings:false,settingsTab:'cloud',
  toast:'',refocus:null,
};
let saveTimer=null;
function localSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;persist();},300);}
// Save immediately if the app is closed or backgrounded right after a change
function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;persist();}}
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();});
function setState(updates){
  const dataChanged=updates.tasks||updates.projects||updates.parking;
  if(updates.tasks)assignOrders(updates.tasks);
  Object.assign(state,updates);
  if(dataChanged){localSave();cloudWrite();scheduleAutoPush();}
  render();
}
let toastTimer=null;
function toast(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render();},3200);}

// ── Manual sync actions ────────────────────────────────────────────────────────
async function syncPush(){
  if(!isSheetsConfigured()){setState({showSettings:true,settingsTab:'sheets'});return;}
  clearTimeout(autoPushTimer);
  setState({syncStatus:'syncing',syncMsg:'Pushing to Google Sheets…'});
  try{
    const merged=await pushToSheets(state.tasks,state.projects,state.parking);
    applySync({tasks:merged,syncStatus:'success',syncMsg:'Merged & pushed ✓'});
    setTimeout(()=>setState({syncStatus:null,syncMsg:''}),3000);
  }catch(e){setState({syncStatus:'error',syncMsg:'Push failed: '+e.message});}
}
async function syncPull(){
  if(!isSheetsConfigured()){setState({showSettings:true,settingsTab:'sheets'});return;}
  setState({syncStatus:'syncing',syncMsg:'Pulling from Google Sheets…'});
  try{
    const data=await pullFromSheets(state.tasks);
    applySync({...data,syncStatus:'success',syncMsg:'Merged & pulled ✓'});
    setTimeout(()=>setState({syncStatus:null,syncMsg:''}),3000);
  }catch(e){setState({syncStatus:'error',syncMsg:'Pull failed: '+e.message});}
}
async function asanaPush(){
  if(!isAsanaConfigured()){setState({showSettings:true,settingsTab:'asana'});return;}
  setState({asanaSyncStatus:'syncing',asanaSyncMsg:'Pushing to Asana…'});
  try{
    const updatedTasks=await pushToAsana(state.tasks);
    setState({tasks:updatedTasks,asanaSyncStatus:'success',asanaSyncMsg:`${updatedTasks.length} tasks synced to Asana ✓`});
    setTimeout(()=>setState({asanaSyncStatus:null,asanaSyncMsg:''}),4000);
  }catch(e){setState({asanaSyncStatus:'error',asanaSyncMsg:'Asana sync failed: '+e.message});}
}

// ── Render (keeps scroll position and focus between re-renders) ────────────────
let renderPending=false;
function render(){
  if(drag&&drag.active){renderPending=true;return;} // don't rebuild the board mid-drag
  renderPending=false;
  const app=document.getElementById('app');
  const board=app.querySelector('.board');
  const boardScroll=board?board.scrollLeft:0;
  const colScroll={};app.querySelectorAll('.col-body').forEach(el=>colScroll[el.dataset.lane]=el.scrollTop);
  const ae=document.activeElement;const aeId=ae&&ae.id&&app.contains(ae)?ae.id:null;
  const caret=aeId&&ae.selectionStart!=null?ae.selectionStart:null;
  const winY=window.scrollY;
  app.innerHTML=buildApp();
  const nb=app.querySelector('.board');if(nb)nb.scrollLeft=boardScroll;
  app.querySelectorAll('.col-body').forEach(el=>{if(colScroll[el.dataset.lane]!=null)el.scrollTop=colScroll[el.dataset.lane];});
  const fid=state.refocus||aeId;state.refocus=null;
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(caret!=null&&fid===aeId&&el.setSelectionRange)try{el.setSelectionRange(caret,caret);}catch{}}}
  window.scrollTo(0,winY);
}

function buildApp(){
  if(state.showSettings)return buildSettingsPage();
  const openParking=state.parking.filter(k=>!k.cleared);
  const open=state.tasks.filter(t=>!t.done);
  const counts={today:open.filter(t=>t.lane==='today').length,week:open.filter(t=>t.lane==='week').length,waiting:open.filter(t=>t.lane==='waiting').length,backlog:open.filter(t=>t.lane==='backlog').length,over:open.filter(t=>isOverdue(t.dueDate,t.status)).length};
  const wide=state.tab==='tasks';
  return`<div style="padding-bottom:env(safe-area-inset-bottom);">${buildHeader(counts,openParking.length)}<div class="wrap${wide?' wide':''}">${buildSyncBar()}${state.tab==='tasks'?buildBoardTab(counts):''}${state.tab==='parking'?buildParkingTab(openParking):''}${state.tab==='pm'?buildPMTab():''}</div>${state.modal?buildModal():''}${state.toast?`<div id="toast">${esc(state.toast)}</div>`:''}</div>`;
}

function cloudStatus(){
  if(!cloud.available)return{label:'☁ Local only',color:'#6B7280',bg:'#F3F4F6'};
  if(!cloud.user)return{label:'☁ Not signed in — saved on this device only',color:'#A16207',bg:'#FEF9C3'};
  if(!cloud.ready)return{label:'☁ Connecting…',color:'#1D4ED8',bg:'#DBEAFE'};
  if(cloud.error)return{label:'☁ Sync problem — tap ⚙',color:'#B91C1C',bg:'#FEE2E2'};
  if(!cloud.online)return{label:'☁ Offline — changes will sync',color:'#A16207',bg:'#FEF9C3'};
  if(cloud.pending)return{label:'☁ Saving…',color:'#1D4ED8',bg:'#DBEAFE'};
  return{label:'☁ Synced',color:'#15803D',bg:'#DCFCE7'};
}

window.saveSheetsSettings=function(e){
  e.preventDefault();
  const clientId=document.getElementById('cfg-clientid').value.trim();
  const sheetId=document.getElementById('cfg-sheetid').value.trim();
  if(!clientId||!sheetId){toast('Please fill in both fields.');return;}
  ls.set('tt_clientid',clientId);ls.set('tt_sheetid',sheetId);
  tokenClient=null;
  setState({showSettings:true,settingsTab:'sheets',syncStatus:'success',syncMsg:'Credentials saved ✓'});
  setTimeout(()=>setState({syncStatus:null,syncMsg:''}),2500);
  initTokenClient();
};
window.saveAsanaSettings=async function(e){
  e.preventDefault();
  const pat=document.getElementById('cfg-asana-pat').value.trim();
  const project=document.getElementById('cfg-asana-project').value.trim();
  if(!pat||!project){toast('Please fill in both fields.');return;}
  ls.set('tt_asana_pat',pat);ls.set('tt_asana_project',project);
  setState({asanaSyncStatus:'syncing',asanaSyncMsg:'Testing Asana connection…',showSettings:true,settingsTab:'asana'});
  try{const name=await testAsanaConnection();setState({asanaSyncStatus:'success',asanaSyncMsg:`Connected to "${name}" ✓`});setTimeout(()=>setState({asanaSyncStatus:null,asanaSyncMsg:''}),3500);}
  catch(ex){setState({asanaSyncStatus:'error',asanaSyncMsg:'Connection failed: '+ex.message});}
};

// ── Board Tab ──────────────────────────────────────────────────────────────────
function matches(t){
  if(state.focus==='ops'&&t.category==='Marketing')return false;
  if(state.focus==='marketing'&&t.category!=='Marketing')return false;
  if(state.filterCat!=='All'&&t.category!==state.filterCat)return false;
  if(state.search&&!`${t.description} ${t.job} ${t.notes}`.toLowerCase().includes(state.search.toLowerCase()))return false;
  return true;
}
// Your order (drag to rearrange). Done is always newest-first.
function sortLane(lane,arr){
  if(lane==='done')return arr.slice().sort((a,b)=>String(b.completedAt||'').localeCompare(String(a.completedAt||''))||((b.order||0)-(a.order||0)));
  return arr.slice().sort((a,b)=>(a.order??0)-(b.order??0));
}
function buildBoardTab(counts){
  const openAll=state.tasks.filter(t=>!t.done&&(t.lane==='today'||t.lane==='week'));

  const dueNow=state.tasks.filter(t=>!t.done&&(t.lane==='backlog'||t.lane==='week')&&t.dueDate&&t.dueDate<=todayStr);

  const focusSeg=`<div class="seg">${[['all','All'],['ops','Ops'],['marketing','Marketing']].map(([id,l])=>`<button class="${state.focus===id?'on':''}" onclick="setFocus('${id}')">${l}</button>`).join('')}</div>`;
  const viewSeg=`<div class="seg" title="Board layout">${[['rows','☰ Rows'],['columns','▥ Columns']].map(([id,l])=>`<button class="${state.layout===id?'on':''}" onclick="setLayout('${id}')">${l}</button>`).join('')}</div>`;
  const catSel=`<select onchange="setFilterCat(this.value)" aria-label="Category"><option value="All">All categories</option>${CATEGORIES.map(c=>`<option value="${esc(c)}"${state.filterCat===c?' selected':''}>${esc(c)}</option>`).join('')}</select>`;
  const toolbar=`<div class="toolbar"><input id="search" type="search" value="${esc(state.search)}" oninput="setSearch(this.value)" placeholder="Search cards…">${focusSeg}${catSel}${viewSeg}</div>`;

function buildColumn(l){
  const all=state.tasks.filter(t=>t.lane===l.id);
  let items=sortLane(l.id,all.filter(matches));
  let more='';
  if(l.id==='done'){
    const cap=15;
    if(!state.doneShowAll&&items.length>cap){more=`<button class="show-more" onclick="setState({doneShowAll:true})">Show all ${items.length}</button>`;items=items.slice(0,cap);}
  }
  const qa=l.id==='done'?'':`<form class="qa" onsubmit="quickAdd(event,'${l.id}')"><input id="qa-${l.id}" name="q" autocomplete="off" placeholder="+ Add a card"></form>`;
  const clearBtn=l.id==='done'&&all.length?`<button onclick="archiveCompleted()" style="margin-left:auto;border:none;background:none;color:#64748B;font-size:11px;font-weight:700;">Clear →</button>`:'';
  const collapsed=!!state.collapsed[l.id];
  const tog=`<button class="tog" onclick="toggleLane('${l.id}')" aria-label="${collapsed?'Expand':'Collapse'} ${l.label}" title="${collapsed?'Expand':'Collapse'}">${collapsed?'▸':'▾'}</button>`;
  return`<section class="col${collapsed?' collapsed':''}" data-lane="${l.id}">
    <div class="col-side">
      <div class="col-head">${tog}<h2>${l.label}</h2><span class="n">${all.length}</span>${clearBtn}</div>
      ${l.hint?`<div class="col-hint">${l.hint}</div>`:''}
      ${qa}
    </div>
    <div class="col-body" data-lane="${l.id}">${items.length?items.map(cardHTML).join(''):`<div class="empty">${all.length?'No cards match your filters':'Nothing here — drag a card in'}</div>`}${more}</div>

}
function cardHTML(t){
  const id=esc(String(t.id));

  const pri=t.priority==='High'?`<span class="pill" style="background:${PRI_COLORS.High.bg};color:${PRI_COLORS.High.text};">High</span>`:t.priority==='Low'?`<span class="pill" style="background:#F1F5F9;color:#64748B;">Low</span>`:'';

  const blocked=t.status==='Blocked'?`<span class="pill" style="background:#FEE2E2;color:#B91C1C;">Blocked</span>`:t.status==='In Progress'&&t.lane!=='today'?`<span class="pill" style="background:#DBEAFE;color:#1D4ED8;">In progress</span>`:'';
  const rep=t.repeat&&t.repeat!=='none'?`<span class="pill" title="${esc((REPEATS.find(r=>r.id===t.repeat)||{}).label)}" style="background:#EEF2FF;color:#4338CA;">↻ ${esc(t.repeat)}</span>`:'';
  const asana=t.asanaGid?`<span title="Synced to Asana" style="font-size:10px;color:#F97316;">●</span>`:'';
  const sub=[t.job?`<span style="font-weight:600;color:#475569;">${esc(t.job)}</span>`:'',(t.lane==='waiting'||t.lane==='today')&&t.notes?esc(t.notes.length>90?t.notes.slice(0,90)+'…':t.notes):''].filter(Boolean).join(' · ');
  const rows=state.layout==='rows';const back=rows?'↑':'‹',fwd=rows?'↓':'›';
  return`<div class="card${over?' overdue':''}${t.done?' done':''}" style="--cat:${cc.dot};" data-id="${id}" onclick="openTask('${id}')">
    <div class="card-top"><button class="chk${t.done?' on':''}" aria-label="${t.done?'Mark not done':'Mark done'}" onclick="event.stopPropagation();toggleDone('${id}')">${t.done?'✓':''}</button><div class="title">${esc(t.description)}</div></div>

  </div>`;
}

// ── Drag and drop ──────────────────────────────────────────────────────────────
// Works with mouse (press and drag) and touch (press and hold ~¼ sec, then drag).
let drag=null,suppressClick=false;
function cardsIn(body){return[...body.querySelectorAll(':scope > .card')].filter(c=>c!==drag.card);}
function placePh(body,x,y){
  const lane=body.dataset.lane;
  if(lane==='done'){body.insertBefore(drag.ph,body.firstChild);return;}
  const cards=cardsIn(body);
  let target=null;
  for(const c of cards){
    const r=c.getBoundingClientRect();
    const single=r.width>body.clientWidth*0.6; // one card per line → compare vertically only
    const before=single?(y<r.top+r.height/2):(y<r.top||(y<=r.bottom&&x<r.left+r.width/2));
    if(before){target=c;break;}
  }
  if(target){if(drag.ph.nextSibling!==target)body.insertBefore(drag.ph,target);}
  else{const tail=body.querySelector(':scope > .show-more');if(tail)body.insertBefore(drag.ph,tail);else if(body.lastChild!==drag.ph)body.appendChild(drag.ph);}
}
function activateDrag(x,y){
  if(!drag)return;
  drag.active=true;
  const r=drag.card.getBoundingClientRect();
  drag.offX=x-r.left;drag.offY=y-r.top;
  const g=drag.card.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.removeAttribute('onclick');document.body.appendChild(g);drag.ghost=g;
  const ph=document.createElement('div');ph.className='ph';ph.style.height=r.height+'px';drag.ph=ph;
  drag.card.parentNode.insertBefore(ph,drag.card);
  drag.card.style.display='none';
  drag.body=drag.card.parentNode;
  document.body.classList.add('is-dragging');
  if(drag.pointerType!=='mouse'&&navigator.vibrate)try{navigator.vibrate(12);}catch{}
  moveDrag(x,y);
  const loop=()=>{if(!drag||!drag.active)return;autoScroll();drag.raf=requestAnimationFrame(loop);};drag.raf=requestAnimationFrame(loop);
}
function moveDrag(x,y){
  drag.x=x;drag.y=y;
  drag.ghost.style.transform=`translate(${x-drag.offX}px,${y-drag.offY}px) rotate(1.5deg)`;
  const el=document.elementFromPoint(x,y);
  const col=el&&el.closest('.col');
  const body=col?col.querySelector('.col-body'):null;
  document.querySelectorAll('.col.over').forEach(c=>{if(c!==col)c.classList.remove('over');});
  if(body){col.classList.add('over');placePh(body,x,y);drag.body=body;}
  drag.overCol=!!body;
}
function autoScroll(){
  const{x,y}=drag;const edge=70,vh=window.innerHeight,vw=window.innerWidth;
  if(y<edge+60)window.scrollBy(0,-Math.ceil((edge+60-y)/5));
  else if(y>vh-edge)window.scrollBy(0,Math.ceil((y-(vh-edge))/5));
  const board=document.querySelector('.board:not(.rows)');
  if(board){if(x<edge)board.scrollLeft-=Math.ceil((edge-x)/4);else if(x>vw-edge)board.scrollLeft+=Math.ceil((x-(vw-edge))/4);}
  if(drag.body&&drag.body.scrollHeight>drag.body.clientHeight){const r=drag.body.getBoundingClientRect();if(y<r.top+40)drag.body.scrollTop-=8;else if(y>r.bottom-40)drag.body.scrollTop+=8;}
  if(drag.ghost)moveDrag(x,y);
}
function endDrag(commit){
  const d=drag;drag=null;
  if(!d)return;
  clearTimeout(d.timer);
  if(!d.active)return;
  cancelAnimationFrame(d.raf);
  document.body.classList.remove('is-dragging');
  document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'));
  d.ghost.remove();
  const body=d.ph.parentNode;
  let lane=null,index=null;
  if(commit&&d.overCol&&body){
    lane=body.dataset.lane;
    index=[...body.children].filter(c=>c===d.ph||(c.classList.contains('card')&&c!==d.card)).indexOf(d.ph);
  }
  d.ph.remove();d.card.style.display='';
  suppressClick=true;setTimeout(()=>suppressClick=false,50);
  if(lane)moveTask(d.id,lane,index);else render();
  if(renderPending)render();
}
document.addEventListener('pointerdown',e=>{
  if(state.tab!=='tasks'||state.modal)return;
  const card=e.target.closest('.board .card');
  if(!card||e.target.closest('button,input,select,textarea,a'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  drag={id:card.dataset.id,card,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,active:false,pointerType:e.pointerType};
  if(e.pointerType!=='mouse')drag.timer=setTimeout(()=>{if(drag&&!drag.active)activateDrag(drag.x,drag.y);},260);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.active){
    drag.x=e.clientX;drag.y=e.clientY;
    const dist=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);
    if(drag.pointerType==='mouse'){if(dist>5)activateDrag(e.clientX,e.clientY);}
    else if(dist>10){clearTimeout(drag.timer);drag=null;} // finger moved first → it's a scroll
    return;
  }
  e.preventDefault();moveDrag(e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault();},{passive:false});
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag&&drag.active)endDrag(false);});
document.addEventListener('contextmenu',e=>{if(drag)e.preventDefault();});
document.addEventListener('click',e=>{if(suppressClick){e.stopPropagation();e.preventDefault();}},true);
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('.card'))e.preventDefault();});

// ── Card actions ───────────────────────────────────────────────────────────────
function findTask(id){return state.tasks.find(t=>String(t.id)===String(id));}
// Move card to `lane`; `index` = drop position among visible cards (omit → top of lane)
window.moveTask=(id,lane,index)=>{
  const t=findTask(id);if(!t)return;
  const same=t.lane===lane;
  if(same&&(index==null||lane==='done'))return;
  const u=same?{...t}:applyLane(t,lane);
  u.order=orderAt(lane,id,index);
  let spawned=null;
  if(lane==='done'&&!t.done){spawned=spawnRepeat(t);if(spawned){u.spawnedNext=true;spawned.order=topOrder(spawned.lane);}}
  const tasks=state.tasks.map(x=>String(x.id)===String(id)?u:x);
  setState({tasks:spawned?[spawned,...tasks]:tasks});
  if(spawned)toast(`↻ Next one added to ${laneLabel(spawned.lane)} — due ${fmtShort(spawned.dueDate)}`);
};
window.toggleLane=lane=>{const c={...state.collapsed,[lane]:!state.collapsed[lane]};ls.set('tt_collapsed',JSON.stringify(c));setState({collapsed:c});};
window.toggleDone=id=>{const t=findTask(id);if(!t)return;moveTask(id,t.done?'today':'done');};
window.quickAdd=(e,lane)=>{
  e.preventDefault();const input=e.target.q;const v=input.value.trim();if(!v)return;
  const category=state.filterCat!=='All'?state.filterCat:state.focus==='marketing'?'Marketing':'Admin';
  const task=normalizeTask({id:uid(),category,description:v,job:'',priority:'Medium',dueDate:lane==='today'?todayStr:'',status:lane==='waiting'?'Waiting':'Not Started',notes:'',done:false,lane,repeat:'none',asanaGid:null,order:topOrder(lane)});
  state.refocus='qa-'+lane;
  setState({tasks:[task,...state.tasks]});
};
window.pullDueIntoToday=()=>{let n=0;const tasks=state.tasks.map(t=>{if(!t.done&&(t.lane==='backlog'||t.lane==='week')&&t.dueDate&&t.dueDate<=todayStr){n++;return{...applyLane(t,'today'),order:topOrder('today')-n};}return t;});setState({tasks});toast(`Moved ${n} card${n!==1?'s':''} to Today`);};
window.deleteTask=id=>{if(confirm('Delete this card?')){addTombstone(id);setState({tasks:state.tasks.filter(t=>String(t.id)!==String(id)),modal:null});}};
window.archiveCompleted=async()=>{
  const done=state.tasks.filter(t=>t.done);
  if(!done.length)return;
  if(cloudOn()){
    if(!confirm(`Clear ${done.length} completed card(s) from the board?\n\nThey stay permanently in your cloud Completed Log (and on the Sheet's Completed Log if connected).`))return;
    // Make sure every one is in the cloud log before removing it from the board
    const ops=done.map(t=>{cloud.logged.add(String(t.id));return['set',collRef('completedLog').doc(String(t.id)),logEntry(t)];});
    await commitOps(ops);
    if(cloud.error){toast('Could not save to the Completed Log — nothing was cleared.');return;}
    const ids=new Set(done.map(t=>String(t.id)));
    setState({tasks:state.tasks.filter(t=>!ids.has(String(t.id)))});
    toast(`Archived ${ids.size} completed card${ids.size!==1?'s':''} ✓`);
    return;
  }
  if(!(isSheetsConfigured()&&ls.get('tt_authed'))){toast('Connect Google Sheets first so completed cards are saved to your Completed Log before clearing.');return;}
  if(!confirm(`Clear ${done.length} completed card(s) from the board?\n\nThey stay permanently in the Completed Log tab on your Google Sheet.`))return;
  setState({syncStatus:'syncing',syncMsg:'Saving to Completed Log…'});
  try{const merged=await pushToSheets(state.tasks,state.projects,state.parking);applySync({tasks:merged});}
  catch(e){setState({syncStatus:'error',syncMsg:'Could not reach Sheets — nothing was cleared.'});return;}
  const ids=new Set(state.tasks.filter(t=>t.done).map(t=>String(t.id)));
  ids.forEach(id=>addTombstone(id));
  applySync({tasks:state.tasks.filter(t=>!ids.has(String(t.id))),syncStatus:'success',syncMsg:'Completed cards archived to log ✓'});
  setTimeout(()=>setState({syncStatus:null,syncMsg:''}),3000);
};

function buildParkingTab(openItems){
  const cleared=state.parking.filter(k=>k.cleared);
  const openHTML=openItems.length===0?`<div style="text-align:center;color:#15803D;background:#DCFCE7;border-radius:12px;padding:22px;font-size:14px;font-weight:600;margin-bottom:14px;">✓ All clear.</div>`:`<div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;margin-bottom:14px;">${openItems.map((item,i)=>{const pc=PRI_COLORS[item.priority]||PRI_COLORS.Medium;const id=esc(String(item.id));return`<div style="padding:12px 13px;border-bottom:${i===openItems.length-1?'none':'1px solid #F3F4F6'};"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><div style="flex:1;min-width:0;"><div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap;">${item.time?`<span style="font-size:11px;color:#9CA3AF;font-weight:600;">${esc(item.time)}</span>`:''}${badge(item.priority,pc)}</div><div style="font-size:13px;color:#374151;margin-bottom:3px;"><strong>Was doing:</strong> ${esc(item.wasWorkingOn)}</div>${item.interruption?`<div style="font-size:13px;color:#6B7280;margin-bottom:5px;"><strong>Interrupted by:</strong> ${esc(item.interruption)}</div>`:''}${item.nextStep?`<div style="font-size:13px;background:#EFF6FF;border-radius:7px;padding:6px 10px;color:#1D4ED8;font-weight:500;">→ ${esc(item.nextStep)}</div>`:''}</div><div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;"><button onclick="clearParking('${id}')" style="background:#DCFCE7;border:none;border-radius:7px;padding:6px 10px;font-size:12px;color:#15803D;font-weight:600;">✓ Done</button><button onclick="parkToCard('${id}')" title="Turn this into a card on the board" style="background:#DBEAFE;border:none;border-radius:7px;padding:6px 10px;font-size:12px;color:#1D4ED8;font-weight:600;">→ Card</button><button onclick="deleteParking('${id}')" style="background:none;border:1px solid #FEE2E2;border-radius:7px;padding:5px 8px;font-size:12px;color:#DC2626;">✕</button></div></div></div>`;}).join('')}</div>`;
  const clearedHTML=cleared.length>0?`<div style="font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Cleared</div><div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;opacity:0.65;">${cleared.map((item,i)=>`<div style="padding:9px 13px;border-bottom:${i===cleared.length-1?'none':'1px solid #F3F4F6'};display:flex;gap:8px;align-items:center;"><span style="color:#15803D;font-size:15px;">✓</span><div style="flex:1;"><div style="font-size:13px;color:#6B7280;text-decoration:line-through;">${esc(item.wasWorkingOn)}</div>${item.nextStep?`<div style="font-size:12px;color:#9CA3AF;">→ ${esc(item.nextStep)}</div>`:''}</div><button onclick="deleteParking('${esc(String(item.id))}')" style="background:none;border:none;font-size:14px;color:#D1D5DB;">✕</button></div>`).join('')}</div>`:'';
  return`<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;"><span style="font-size:20px;">🅿</span><div><div style="font-size:13px;font-weight:700;color:#C2410C;margin-bottom:2px;">Before you deal with it — park it first.</div><div style="font-size:12px;color:#9A3412;line-height:1.5;">5 seconds: what were you doing, what interrupted you, what's your next step. Tap <strong>→ Card</strong> to put it on the board.</div></div></div><div style="font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Open — ${openItems.length} item${openItems.length!==1?'s':''}</div>${openHTML}${clearedHTML}`;

// ── PM Tab ─────────────────────────────────────────────────────────────────────
function buildPMTab(){
  const hCounts=PM_HEALTH.map(h=>({h,c:state.projects.filter(p=>p.health===h).length})).filter(x=>x.c>0);
  const summaryCards=hCounts.map(({h,c})=>{const hc=HEALTH_COLORS[h];return`<div style="background:${hc.bg};border:1px solid ${hc.text}30;border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">${hc.icon}</span><div><div style="font-size:20px;font-weight:800;color:${hc.text};">${c}</div><div style="font-size:11px;color:${hc.text};font-weight:600;">${h}</div></div></div>`;}).join('');
  const projectCards=state.projects.map(proj=>{
    const pid=esc(String(proj.id));
    const hc=HEALTH_COLORS[proj.health]||HEALTH_COLORS['On Track'];
    const key=(proj.name||'').toLowerCase().split(' ')[0];
    const linked=key?state.tasks.filter(t=>t.job&&t.job.toLowerCase().includes(key)):[];
    const sorted=linked.slice().sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;return(PRI_ORD[a.priority]??1)-(PRI_ORD[b.priority]??1);});
    const doneCount=linked.filter(t=>t.done).length;
    const showDone=!!state.pmShowCompleted[proj.id];
    const visible=showDone?sorted:sorted.filter(t=>!t.done);
    const dl=daysLeft(proj.targetEnd);const dlText=dl===null?'':(dl<0?`${Math.abs(dl)}d overdue`:`${dl}d left`);const dlColor=dl===null?'':(dl<0?'#DC2626':dl<7?'#A16207':'#15803D');
    return`<div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;margin-bottom:12px;"><div style="padding:11px 13px;background:${hc.bg};border-bottom:2px solid ${hc.text}25;"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><div><div style="display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap;"><span style="font-size:15px;">${hc.icon}</span><span style="font-size:15px;font-weight:800;color:#111827;">${esc(proj.name)}</span><span style="font-size:12px;color:#6B7280;">${esc(proj.jobNum)}</span></div><div style="font-size:12px;color:#6B7280;">PM: <strong style="color:#374151;">${esc(proj.pm)}</strong> · ${fmtDate(proj.startDate)} → ${fmtDate(proj.targetEnd)} ${dlText?`<strong style="color:${dlColor};">(${dlText})</strong>`:''}</div></div><div style="display:flex;gap:4px;flex-shrink:0;"><button onclick="openProject('${pid}')" style="background:none;border:1px solid #E5E7EB;border-radius:6px;padding:5px 9px;font-size:12px;color:#6B7280;">Edit</button><button onclick="deleteProject('${pid}')" style="background:none;border:1px solid #FEE2E2;border-radius:6px;padding:5px 8px;font-size:12px;color:#DC2626;">✕</button></div></div></div><div style="padding:12px 13px;"><div style="margin-bottom:10px;"><div style="font-size:11px;font-weight:600;color:#9CA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em;">Progress</div><div style="display:flex;align-items:center;gap:10px;"><div style="flex:1;height:8px;background:#E5E7EB;border-radius:99px;overflow:hidden;"><div style="width:${proj.pctComplete}%;height:100%;background:${proj.pctComplete>=80?'#16A34A':proj.pctComplete>=50?'#2563EB':'#F97316'};border-radius:99px;"></div></div><span style="font-size:13px;font-weight:700;color:#374151;min-width:34px;">${proj.pctComplete}%</span></div>${proj.blockers?`<div style="margin-top:7px;font-size:12px;color:#B91C1C;background:#FEF2F2;border-radius:6px;padding:5px 9px;">⚠ ${esc(proj.blockers)}</div>`:''}</div><div><div style="font-size:11px;font-weight:600;color:#9CA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em;">Linked Cards (${linked.length}) <span style="background:#DBEAFE;color:#1D4ED8;border-radius:99px;padding:1px 6px;font-size:10px;">auto</span>${doneCount>0?`<button onclick="togglePMCompleted('${pid}')" style="float:right;background:none;border:none;color:#2563EB;font-size:11px;font-weight:600;cursor:pointer;padding:0;text-transform:none;letter-spacing:0;">${showDone?'Hide':'Show'} ${doneCount} completed</button>`:''}</div>${linked.length?`<div style="display:flex;flex-direction:column;gap:6px;">${visible.map(t=>`<div onclick="openTask('${esc(String(t.id))}')" style="cursor:pointer;display:flex;align-items:flex-start;gap:7px;padding:6px 8px;background:#F8FAFC;border-radius:7px;"><span style="margin-top:2px;width:15px;height:15px;border-radius:4px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:${t.done?'#16A34A':'#D1D5DB'};">${t.done?'✓':''}</span><div style="flex:1;min-width:0;"><div style="font-size:13px;color:${t.done?'#9CA3AF':'#374151'};font-weight:600;text-decoration:${t.done?'line-through':'none'};margin-bottom:3px;word-break:break-word;">${esc(t.description)}</div><div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">${badge(laneLabel(t.lane),{bg:'#EEF2FF',text:'#4338CA'})}${badge(t.priority,PRI_COLORS[t.priority]||PRI_COLORS.Medium)}${t.dueDate?`<span style="font-size:11px;color:${isOverdue(t.dueDate,t.status)?'#DC2626':'#6B7280'};">${fmtDate(t.dueDate)}</span>`:''}</div></div></div>`).join('')}</div>`:`<div style="font-size:12px;color:#9CA3AF;font-style:italic;">No cards linked yet — add a card with this project name in its Job field.</div>`}</div></div><div style="padding:5px 13px 9px;border-top:1px solid #F3F4F6;"><span style="font-size:11px;color:#9CA3AF;">Last check-in: ${fmtDate(proj.lastCheckin)||'—'}</span></div></div>`;
  }).join('');
  return`${summaryCards?`<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">${summaryCards}</div>`:''} ${state.projects.length===0?`<div style="text-align:center;color:#9CA3AF;padding:40px 0;font-size:14px;">No projects yet.</div>`:projectCards}`;
}

// ── Modals ─────────────────────────────────────────────────────────────────────
function buildModal(){
  const m=state.modal;
  if(m.type==='task')return buildTaskModal(m.id?findTask(m.id):null,m.lane);
  if(m.type==='park')return buildParkModal();
  if(m.type==='project')return buildPMModal(m.id?state.projects.find(p=>String(p.id)===String(m.id)):null);
  return'';
}
function buildTaskModal(task,lane){
  const t=task||{category:state.filterCat!=='All'?state.filterCat:(state.focus==='marketing'?'Marketing':'Service Calendar'),description:'',job:'',priority:'Medium',dueDate:lane==='today'?todayStr:'',status:lane==='waiting'?'Waiting':'Not Started',notes:'',lane:lane||'backlog',repeat:'none'};
  const idArg=task?`'${esc(String(task.id))}'`:'null';
  return modal(`<h3 style="margin:0 0 16px;font-size:15px;font-weight:700;">${task?'Edit Card':'New Card'}</h3><form onsubmit="submitTaskForm(event,${idArg})">${fi('What needs doing? *','description',t.description,'textarea')}${fi('Job / Customer','job',t.job)}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;"><div>${lbl('Board column')}${sel('lane',LANES,t.lane)}</div><div>${lbl('Category')}${sel('category',CATEGORIES,t.category)}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;"><div>${lbl('Priority')}${sel('priority',PRIORITIES,t.priority)}</div><div>${lbl('Status')}${sel('status',STATUSES,t.status)}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">${fi('Due date (optional)','dueDate',t.dueDate||'','date')}<div style="margin-bottom:12px;">${lbl('Repeats')}${sel('repeat',REPEATS,t.repeat||'none')}</div></div>${fi('Notes','notes',t.notes,'textarea',t.lane==='waiting'?'Who/what are you waiting on?':'')}<div style="display:flex;gap:8px;align-items:center;margin-top:4px;">${task?`<button type="button" onclick="deleteTask('${esc(String(task.id))}')" style="padding:9px 12px;border-radius:8px;border:1.5px solid #FEE2E2;background:#fff;font-size:13px;font-weight:600;color:#DC2626;">Delete</button>`:''}<span style="flex:1;"></span><button type="button" onclick="closeModal()" style="padding:9px 16px;border-radius:8px;border:1.5px solid #D1D5DB;background:#fff;font-size:13px;font-weight:600;color:#374151;">Cancel</button><button type="submit" style="padding:9px 18px;border-radius:8px;border:none;background:#2563EB;color:#fff;font-size:13px;font-weight:700;">${task?'Save':'Add Card'}</button></div></form>`);
}
function buildParkModal(){return modal(`<h3 style="margin:0 0 4px;font-size:15px;font-weight:700;">🅿 Park an Interruption</h3><p style="font-size:12px;color:#6B7280;margin-bottom:16px;">30 seconds max — just enough to find your place again.</p><form onsubmit="submitParkForm(event)">${fi('I was working on…','wasWorkingOn','','textarea')}${fi('Interruption was…','interruption','','textarea')}${fi('Next step when I return','nextStep','','textarea')}<div style="margin-bottom:14px;">${lbl('Priority')}<div style="display:flex;gap:8px;">${PRIORITIES.map(p=>`<button type="button" onclick="setParkPri('${p}')" id="pri-${p}" style="flex:1;padding:7px;border-radius:8px;border:2px solid #E5E7EB;background:#fff;color:#374151;font-size:13px;font-weight:600;">${p}</button>`).join('')}</div></div><div style="display:flex;gap:8px;justify-content:flex-end;"><button type="button" onclick="closeModal()" style="padding:9px 16px;border-radius:8px;border:1.5px solid #D1D5DB;background:#fff;font-size:13px;font-weight:600;color:#374151;">Cancel</button><button type="submit" style="padding:9px 18px;border-radius:8px;border:none;background:#F97316;color:#fff;font-size:13px;font-weight:700;">Park It</button></div></form>`);}
function buildPMModal(proj){
  const p=proj||{name:'',pm:'',jobNum:'',startDate:todayStr,targetEnd:'',pctComplete:0,health:'On Track',blockers:''};
  const idArg=proj?`'${esc(String(proj.id))}'`:'null';
  const inp=(l,k,t='text')=>`<div>${lbl(l)}<input type="${t}" name="${k}" value="${esc(p[k]||'')}" style="width:100%;border:1.5px solid #D1D5DB;border-radius:8px;padding:8px 10px;font-size:13px;box-sizing:border-box;outline:none;"></div>`;
  return modal(`<h3 style="margin:0 0 16px;font-size:15px;font-weight:700;">${proj?'Update Project':'Add Project'}</h3><form onsubmit="submitPMForm(event,${idArg})">${fi('Project Name *','name',p.name)}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">${inp('PM Name','pm')}${inp('Job #','jobNum')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">${inp('Start Date','startDate','date')}${inp('Target End','targetEnd','date')}</div><div style="margin-bottom:12px;">${lbl(`% Complete — <span id="pct-label">${p.pctComplete}</span>%`)}<input type="range" name="pctComplete" min="0" max="100" value="${p.pctComplete}" oninput="document.getElementById('pct-label').textContent=this.value" style="width:100%;accent-color:#2563EB;"></div><div style="margin-bottom:12px;">${lbl('Health')}${sel('health',PM_HEALTH,p.health)}</div>${fi('Blockers / Notes','blockers',p.blockers||'','textarea')}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px;"><button type="button" onclick="closeModal()" style="padding:9px 16px;border-radius:8px;border:1.5px solid #D1D5DB;background:#fff;font-size:13px;font-weight:600;color:#374151;">Cancel</button><button type="submit" style="padding:9px 18px;border-radius:8px;border:none;background:#2563EB;color:#fff;font-size:13px;font-weight:700;">${proj?'Save':'Add'}</button></div></form>`);
}

window.openTask=(id,lane)=>setState({modal:{type:'task',id:id||null,lane:lane||'backlog'}});
window.openProject=id=>setState({modal:{type:'project',id:id||null}});

window.deleteParking=id=>setState({parking:state.parking.filter(k=>String(k.id)!==String(id))});
window.parkToCard=id=>{
  const k=state.parking.find(x=>String(x.id)===String(id));if(!k)return;
  const notes=[k.time?`Parked ${k.time}`:'',k.wasWorkingOn?`Was working on: ${k.wasWorkingOn}`:'',k.interruption?`Interrupted by: ${k.interruption}`:''].filter(Boolean).join(' · ');
  const task=normalizeTask({id:uid(),category:'Admin',description:k.nextStep||k.wasWorkingOn,job:'',priority:k.priority||'Medium',dueDate:todayStr,status:'Not Started',notes,done:false,lane:'today',repeat:'none',asanaGid:null,order:topOrder('today')});
  setState({tasks:[task,...state.tasks],parking:state.parking.map(x=>String(x.id)===String(id)?{...x,cleared:true}:x)});
  toast('Added to Today on the board');
};
window.deleteProject=id=>{if(confirm('Delete this project?'))setState({projects:state.projects.filter(p=>String(p.id)!==String(id))});};
window.setParkPri=pri=>{PRIORITIES.forEach(p=>{const btn=document.getElementById(`pri-${p}`);if(!btn)return;const pc=PRI_COLORS[p];btn.style.border=p===pri?`2px solid ${pc.text}`:'2px solid #E5E7EB';btn.style.background=p===pri?pc.bg:'#fff';btn.style.color=p===pri?pc.text:'#374151';});window._parkPri=pri;};
window.submitTaskForm=(e,id)=>{
  e.preventDefault();const fd=new FormData(e.target);
  const prev=id?findTask(id):null;
  const description=String(fd.get('description')||'').trim();if(!description)return;
  let lane=fd.get('lane'),status=fd.get('status');
  const laneChanged=!prev||prev.lane!==lane;
  const statusChanged=!prev||prev.status!==status;
  // Keep status and column in step
  const isWait=s=>s==='Waiting'||s==='Blocked';
  if(statusChanged&&!laneChanged){
    // Status was changed → move the card to match
    if(status==='Complete')lane='done';
    else if(isWait(status))lane='waiting';
    else if(lane==='waiting'||lane==='done')lane=deriveLane({status,dueDate:fd.get('dueDate')||''});
  }else{
    // Column was changed (or both) → column wins, status follows
    if(lane==='done')status='Complete';
    else if(lane==='waiting'){if(!isWait(status))status='Waiting';}
    else if(isWait(status)||status==='Complete')status='Not Started';
  }
  let task={...(prev||{}),id:id||uid(),category:fd.get('category'),description,job:fd.get('job'),priority:fd.get('priority'),dueDate:fd.get('dueDate')||'',status,notes:fd.get('notes'),lane,repeat:fd.get('repeat')||'none',done:lane==='done',completedAt:lane==='done'?((prev&&prev.completedAt)||todayStr):null,asanaGid:prev?prev.asanaGid||null:null,sample:undefined};
  if(lane==='waiting'&&status!=='Waiting'&&status!=='Blocked')task.status='Waiting';
  task=normalizeTask(task);
  if(!prev||prev.lane!==task.lane)task.order=topOrder(task.lane,task.id); // new or moved → top of its lane
  let spawned=null;
  if(task.done&&!(prev&&prev.done)){spawned=spawnRepeat(task);if(spawned){task.spawnedNext=true;spawned.order=topOrder(spawned.lane);}}
  let tasks=id?state.tasks.map(t=>String(t.id)===String(id)?task:t):[task,...state.tasks];
  if(spawned)tasks=[spawned,...tasks];
  setState({tasks,modal:null});
  if(spawned)toast(`↻ Next one added to ${laneLabel(spawned.lane)} — due ${fmtShort(spawned.dueDate)}`);
};
window.submitParkForm=e=>{e.preventDefault();const fd=new FormData(e.target);setState({parking:[{id:Date.now(),time:nowTime(),wasWorkingOn:fd.get('wasWorkingOn'),interruption:fd.get('interruption'),nextStep:fd.get('nextStep'),priority:window._parkPri||'Medium',cleared:false},...state.parking],modal:null});window._parkPri=null;};
window.submitPMForm=(e,id)=>{e.preventDefault();const fd=new FormData(e.target);const proj={id:id||Date.now(),name:fd.get('name'),pm:fd.get('pm'),jobNum:fd.get('jobNum'),startDate:fd.get('startDate'),targetEnd:fd.get('targetEnd'),pctComplete:parseInt(fd.get('pctComplete')||'0'),health:fd.get('health'),blockers:fd.get('blockers'),lastCheckin:todayStr};if(!String(proj.name||'').trim())return;setState({projects:id?state.projects.map(p=>String(p.id)===String(id)?proj:p):[proj,...state.projects],modal:null});};
window.syncPush=syncPush;
window.syncPull=syncPull;
window.asanaPush=asanaPush;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)setState({modal:null});});

// ── Service Worker (network-first so updates show up right away) ───────────────
if('serviceWorker' in navigator){const sw=`const C='tt-v10';self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>clients.claim())));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(res=>{const c=res.clone();caches.open(C).then(ca=>ca.put(e.request,c));return res;}).catch(()=>caches.match(e.request)));});`;const blob=new Blob([sw],{type:'application/javascript'});navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});}
</script>
