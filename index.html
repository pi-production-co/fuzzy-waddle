<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Task Tracker">
<meta name="theme-color" content="#1F2937">
<title>Task Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#F1F5F9;color:#111827;min-height:100vh;overscroll-behavior:none;}
button,input,textarea,select{font-family:inherit;cursor:pointer;}
input,textarea{cursor:text;}
#app{min-height:100vh;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#install-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:#1F2937;color:#fff;padding:14px 16px;z-index:200;border-top:2px solid #2563EB;align-items:center;gap:12px;}
#install-banner.show{display:flex;}
#install-banner p{flex:1;font-size:13px;line-height:1.4;}
#install-banner p strong{display:block;font-size:14px;margin-bottom:2px;}
#install-btn{background:#2563EB;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;white-space:nowrap;}
#dismiss-btn{background:none;border:1px solid #4B5563;color:#9CA3AF;border-radius:8px;padding:9px 12px;font-size:12px;}
#ios-hint{display:none;position:fixed;bottom:0;left:0;right:0;background:#1F2937;color:#fff;padding:14px 16px 28px;z-index:200;border-top:2px solid #2563EB;}
#ios-hint.show{display:block;}
#ios-hint p{font-size:13px;line-height:1.6;margin-bottom:10px;}
#ios-hint strong{color:#60A5FA;}
#ios-close{background:none;border:1px solid #4B5563;color:#9CA3AF;border-radius:8px;padding:7px 14px;font-size:12px;width:100%;}

/* ── Board ── */
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 80px;}
.wrap.wide{max-width:none;padding:14px 14px 40px;}
.toolbar{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.toolbar input[type=search]{flex:1;min-width:140px;border:1.5px solid #E5E7EB;border-radius:8px;padding:7px 10px;font-size:13px;outline:none;}
.toolbar select{border:1.5px solid #E5E7EB;border-radius:8px;padding:6px 8px;font-size:12px;background:#fff;color:#374151;font-weight:600;}
.seg{display:inline-flex;background:#F1F5F9;border-radius:8px;padding:2px;}
.seg button{border:none;background:transparent;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#6B7280;}
.seg button.on{background:#fff;color:#111827;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.stat{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:8px 12px;min-width:84px;flex:1;}
.stat b{display:block;font-size:20px;font-weight:800;}
.stat span{font-size:11px;color:#6B7280;font-weight:600;}
.nudge{background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:10px;padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:#1E40AF;}
.nudge button{margin-left:auto;background:#2563EB;color:#fff;border:none;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap;}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;align-items:flex-start;}
.col{flex:1 0 250px;min-width:250px;background:#E9EEF4;border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 230px);min-height:200px;scroll-snap-align:start;border:2px solid transparent;transition:border-color .15s,background .15s;}
.col.over{border-color:#2563EB;background:#DBEAFE;}
.col-head{padding:10px 12px 6px;display:flex;align-items:baseline;gap:8px;}
.col-head h2{font-size:13px;font-weight:800;color:#1F2937;letter-spacing:.02em;text-transform:uppercase;}
.col-head .n{font-size:11px;font-weight:800;color:#475569;background:#fff;border-radius:99px;padding:1px 8px;}
.col-hint{font-size:11px;color:#64748B;padding:0 12px 6px;}
.qa{padding:0 8px 8px;}
.qa input{width:100%;border:1.5px dashed #CBD5E1;background:#F8FAFC;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
.qa input:focus{border-style:solid;border-color:#2563EB;background:#fff;}
.col-body{overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:7px;flex:1;}
.empty{font-size:12px;color:#94A3B8;text-align:center;padding:16px 6px;font-style:italic;}
.card{background:#fff;border-radius:9px;border:1px solid #E2E8F0;border-left:4px solid var(--cat,#94A3B8);padding:9px 10px 8px;box-shadow:0 1px 2px rgba(15,23,42,.05);cursor:grab;position:relative;}
.card:hover{box-shadow:0 3px 8px rgba(15,23,42,.1);}
.card.dragging{opacity:.4;}
.card.overdue{background:#FFF7F7;}
.card.done{opacity:.6;}
.card-top{display:flex;gap:8px;align-items:flex-start;}
.chk{width:18px;height:18px;border-radius:5px;border:2px solid #CBD5E1;background:#fff;flex-shrink:0;margin-top:1px;font-size:11px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
.chk.on{background:#16A34A;border-color:#16A34A;}
.title{font-size:13.5px;font-weight:600;line-height:1.35;word-break:break-word;flex:1;}
.card.done .title{text-decoration:line-through;color:#94A3B8;font-weight:500;}
.meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px;padding-left:26px;}
.pill{font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;white-space:nowrap;}
.sub{font-size:11.5px;color:#64748B;margin-top:4px;padding-left:26px;line-height:1.4;word-break:break-word;}
.mv{display:none;position:absolute;right:6px;bottom:6px;gap:3px;}
.mv button{border:1px solid #E2E8F0;background:#fff;border-radius:6px;width:24px;height:22px;font-size:12px;color:#475569;line-height:1;}
.card:hover .mv{display:flex;}
@media (hover:none){.mv{display:flex;position:static;justify-content:flex-end;margin-top:6px;}.mv button{width:34px;height:28px;font-size:14px;}}
/* Rows layout: each lane is a horizontal band, cards flow left → right */
.board.rows{flex-direction:column;overflow:visible;scroll-snap-type:none;gap:10px;align-items:stretch;}
.board.rows .col{flex:none;width:100%;min-width:0;max-height:none;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start;}
.board.rows .col-side{padding-bottom:8px;}
.board.rows .col-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));overflow:visible;padding:10px 10px 10px 0;align-content:start;min-height:70px;}
.board.rows .col-body>.empty,.board.rows .col-body>.show-more{grid-column:1/-1;}
.board.rows .empty{text-align:left;padding:14px 4px;}
.col.collapsed .col-hint,.col.collapsed .qa{display:none;}
.col.collapsed .col-body{display:none!important;}
.col.collapsed{min-height:0!important;}
.tog{border:none;background:none;color:#64748B;font-size:12px;font-weight:800;padding:0 2px;width:18px;}
.show-more{border:none;background:none;color:#2563EB;font-size:12px;font-weight:700;padding:6px;}
/* Drag to reorder */
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.ph{border:2px dashed #2563EB;background:rgba(37,99,235,.06);border-radius:9px;min-height:44px;}
.col-body:has(.ph)>.empty{display:none;}
.ghost{position:fixed;left:0;top:0;z-index:400;pointer-events:none;box-shadow:0 12px 28px rgba(15,23,42,.28)!important;opacity:.95;cursor:grabbing;}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;}
@media (max-width:640px){.board:not(.rows) .col{flex:0 0 86vw;max-height:calc(100vh - 250px);}.board.rows .col{grid-template-columns:1fr;}.board.rows .col-body{padding:0 8px 10px;grid-template-columns:1fr;}.board.rows .col-side{padding-bottom:4px;}.stat{min-width:70px;padding:7px 10px;}.stat b{font-size:17px;}}
.pj-list{display:flex;flex-direction:column;gap:6px;}
.pj{background:#fff;border:1px solid #E5E7EB;border-radius:10px;}
.pj.open{box-shadow:0 2px 8px rgba(15,23,42,.06);}
.pj-row{display:grid;grid-template-columns:20px 10px minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;}
.pj-handle{cursor:grab;color:#94A3B8;font-weight:900;letter-spacing:-3px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center;font-size:15px;padding:6px 0;}
.pj-handle:hover{color:#475569;}
.pj-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.pj-name{min-width:0;}
.pj-name b{display:block;font-size:14px;font-weight:800;color:#111827;word-break:break-word;}
.pj-name span{font-size:11.5px;color:#64748B;}
.pj-stats{display:flex;align-items:center;gap:10px;justify-content:flex-start;flex-wrap:wrap;width:min(380px,44vw);}
.pj-prog{display:flex;align-items:center;gap:6px;width:130px;}
.pj-prog .bar{flex:1;height:7px;background:#E5E7EB;border-radius:99px;overflow:hidden;}
.pj-prog .bar i{display:block;height:100%;border-radius:99px;}
.pj-prog span{font-size:12px;font-weight:700;color:#374151;min-width:32px;text-align:right;}
.pj-due{font-size:12px;font-weight:700;min-width:84px;}
.pj-chev{color:#94A3B8;font-size:12px;}
.pj-detail{padding:2px 14px 14px 52px;}
.pj-ph{border:2px dashed #7E22CE;background:rgba(126,34,206,.05);border-radius:10px;}
.pj.ghost{position:fixed;left:0;top:0;z-index:400;pointer-events:none;box-shadow:0 12px 28px rgba(15,23,42,.25);opacity:.96;}
@media (max-width:640px){.pj-row{grid-template-columns:20px 10px minmax(0,1fr) 14px;}.pj-stats{grid-column:3/5;grid-row:2;width:auto;gap:8px;}.pj-chev{grid-column:4;grid-row:1;}.pj-handle{grid-row:1/3;}.pj-detail{padding:2px 12px 12px 12px;}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2937;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.25);}
/* ── Focus mode ── */
.fm{min-height:100vh;background:#F1F5F9;padding-bottom:60px;}
.fm-top{background:#1F2937;color:#fff;position:sticky;top:0;z-index:50;}
.fm-top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.fm-title{font-size:16px;font-weight:800;}
.fm-sub{font-size:11px;color:#9CA3AF;}
.fm-timer{order:2;margin-left:auto;display:flex;align-items:center;gap:5px;}
.fm-time{font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;min-width:62px;text-align:center;}
.fm-tbtn{background:rgba(255,255,255,.1);color:#E5E7EB;border:none;border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;white-space:nowrap;}
.fm-tbtn.on{background:#2563EB;color:#fff;}
.fm-tbtn:disabled{opacity:.45;}
.fm-exit{order:3;background:transparent;border:1.5px solid #4B5563;color:#E5E7EB;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;}
.fm-body{max-width:760px;margin:0 auto;padding:22px 16px;}
.fm-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748B;margin:0 0 8px;}
.fm-now{background:#fff;border:1px solid #E2E8F0;border-left:6px solid var(--cat,#94A3B8);border-radius:16px;padding:22px 22px 18px;box-shadow:0 8px 24px rgba(15,23,42,.08);}
.fm-now h1{font-size:26px;line-height:1.25;font-weight:800;margin:10px 0 4px;word-break:break-word;cursor:pointer;color:#111827;}
.fm-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.fm-job{font-size:14px;color:#475569;font-weight:600;}
.fm-notes{font-size:14px;color:#475569;line-height:1.55;margin-top:12px;white-space:pre-wrap;background:#F8FAFC;border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;word-break:break-word;}
.fm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
.fm-actions button{border:none;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:800;}
.fm-done{background:#16A34A;color:#fff;flex:1 1 150px;}
.fm-sec{background:#EEF2F7;color:#334155;}
.fm-next{margin-top:26px;}
.fm-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E2E8F0;border-left:4px solid var(--cat,#94A3B8);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
.fm-item .t{flex:1;min-width:0;font-size:14px;font-weight:600;word-break:break-word;cursor:pointer;color:#1E293B;}
.fm-item .d{font-size:11.5px;color:#64748B;white-space:nowrap;}
.fm-item button{border:1px solid #E2E8F0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700;color:#475569;white-space:nowrap;}
.fm-empty{text-align:center;background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:28px 20px;}
.fm-stat{font-size:13px;color:#64748B;margin-top:18px;text-align:center;}
.fm-enter{background:#4F46E5;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap;}
@media (max-width:640px){.fm-now{padding:18px 16px 14px;}.fm-now h1{font-size:22px;}.fm-timer{margin-left:0;width:100%;justify-content:space-between;order:3;}.fm-exit{order:2;margin-left:auto;}}

/* ── Dark mode ── */
html[data-theme=dark]{color-scheme:dark;}
html[data-theme=dark] body{background:#0B1220;color:#E5E7EB;}
[data-theme=dark] .toolbar,[data-theme=dark] .stat,[data-theme=dark] .card,[data-theme=dark] .pj,[data-theme=dark] .fm-now,[data-theme=dark] .fm-item,[data-theme=dark] .fm-empty{background:#1B2537;border-color:#2A3650;}
[data-theme=dark] .card{border-left-color:var(--cat,#94A3B8);box-shadow:none;}
[data-theme=dark] .fm-now,[data-theme=dark] .fm-item{border-left-color:var(--cat,#94A3B8);}
[data-theme=dark] .col{background:#131C2E;}
[data-theme=dark] .col.over{background:#172554;border-color:#3B82F6;}
[data-theme=dark] .card.overdue{background:#2A1C24;}
[data-theme=dark] .col-head h2,[data-theme=dark] .pj-name b,[data-theme=dark] .title,[data-theme=dark] .pj-prog span{color:#E5E7EB;}
[data-theme=dark] .card.done .title{color:#64748B;}
[data-theme=dark] .col-head .n{background:#1B2537;color:#CBD5E1;}
[data-theme=dark] .col-hint,[data-theme=dark] .sub,[data-theme=dark] .pj-name span,[data-theme=dark] .stat span,[data-theme=dark] .fm-job,[data-theme=dark] .fm-label,[data-theme=dark] .fm-stat,[data-theme=dark] .fm-item .d{color:#94A3B8;}
[data-theme=dark] .qa input{background:#131C2E;border-color:#334155;color:#E5E7EB;}
[data-theme=dark] .qa input:focus{background:#1B2537;border-color:#3B82F6;}
[data-theme=dark] .toolbar input[type=search],[data-theme=dark] .toolbar select{background:#131C2E;border-color:#334155;color:#E5E7EB;}
[data-theme=dark] .seg{background:#131C2E;}
[data-theme=dark] .seg button{color:#94A3B8;}
[data-theme=dark] .seg button.on{background:#2A3650;color:#F1F5F9;box-shadow:none;}
[data-theme=dark] .chk{background:#131C2E;border-color:#475569;}
[data-theme=dark] .chk.on{background:#16A34A;border-color:#16A34A;}
[data-theme=dark] .mv button,[data-theme=dark] .fm-item button{background:#243049;border-color:#334155;color:#CBD5E1;}
[data-theme=dark] .nudge{background:#172554;border-color:#1E3A8A;color:#BFDBFE;}
[data-theme=dark] .empty{color:#64748B;}
[data-theme=dark] .pj-prog .bar{background:#2A3650;}
[data-theme=dark] .ph{background:rgba(59,130,246,.12);}
[data-theme=dark] .fm{background:#0B1220;}
[data-theme=dark] .fm-notes{background:#131C2E;color:#CBD5E1;}
[data-theme=dark] .fm-sec{background:#243049;color:#E5E7EB;}
[data-theme=dark] .fm-now h1,[data-theme=dark] .fm-item .t{color:#F1F5F9;}
[data-theme=dark] code{background:#243049;border-radius:4px;padding:0 3px;}
/* inline-styled pieces (modals, settings, parking, projects, import) */
[data-theme=dark] [style*="background:#fff"]{background-color:#1B2537!important;}
[data-theme=dark] [style*="background:#F8FAFC"],[data-theme=dark] [style*="background:#FAFAFA"]{background-color:#131C2E!important;}
[data-theme=dark] [style*="background:#F1F5F9"],[data-theme=dark] [style*="background:#F3F4F6"]{background-color:#243049!important;}
[data-theme=dark] [style*="background:#E5E7EB"]{background-color:#2A3650!important;}
[data-theme=dark] [style*="background:#EFF6FF"]{background-color:#172554!important;color:#BFDBFE!important;}
[data-theme=dark] [style*="color:#111827"],[data-theme=dark] [style*="color:#1F2937"]{color:#F1F5F9!important;}
[data-theme=dark] [style*="color:#374151"],[data-theme=dark] [style*="color:#475569"],[data-theme=dark] [style*="color:#334155"]{color:#CBD5E1!important;}
[data-theme=dark] [style*="color:#6B7280"],[data-theme=dark] [style*="color:#64748B"]{color:#94A3B8!important;}
[data-theme=dark] [style*="color:#9CA3AF"],[data-theme=dark] [style*="color:#94A3B8"]{color:#7C8BA3!important;}
[data-theme=dark] [style*="solid #E5E7EB"],[data-theme=dark] [style*="solid #D1D5DB"],[data-theme=dark] [style*="solid #E2E8F0"],[data-theme=dark] [style*="solid #F3F4F6"],[data-theme=dark] [style*="solid #F1F5F9"],[data-theme=dark] [style*="dashed #CBD5E1"],[data-theme=dark] [style*="solid #FEE2E2"]{border-color:#2A3650!important;}
[data-theme=dark] #modal-sheet{background:#1B2537!important;color:#E5E7EB;}
[data-theme=dark] #modal-sheet input:not([type=range]):not([type=file]),[data-theme=dark] #modal-sheet textarea,[data-theme=dark] #modal-sheet select{background:#131C2E!important;color:#E5E7EB;border-color:#334155!important;}
</style>
<script>try{var t=localStorage.getItem('tt_theme')||'light';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6B7280;font-size:14px;">Loading…</div></div>
<div id="install-banner">
  <p><strong>📲 Install Task Tracker</strong>Add to your home screen for quick access</p>
  <button id="dismiss-btn" onclick="dismissInstall()">Later</button>
  <button id="install-btn" onclick="triggerInstall()">Install</button>
</div>
<div id="ios-hint">
  <p>To install on iPhone: tap the <strong>Share button ↑</strong> in Safari, then tap <strong>"Add to Home Screen"</strong>.</p>
  <button id="ios-close">Got it</button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// ── Storage ────────────────────────────────────────────────────────────────────
const ls={
  get(k){try{return localStorage.getItem(k);}catch{return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch{}},
  del(k){try{localStorage.removeItem(k);}catch{}},
};

// ── PWA Install ────────────────────────────────────────────────────────────────
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!ls.get('pwa-dismissed'))document.getElementById('install-banner').classList.add('show');});
function triggerInstall(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('install-banner').classList.remove('show');});}}
function dismissInstall(){document.getElementById('install-banner').classList.remove('show');ls.set('pwa-dismissed','1');}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone;
if(isIOS&&!isStandalone&&!ls.get('ios-hint-dismissed')){
  setTimeout(()=>document.getElementById('ios-hint').classList.add('show'),2500);
  document.getElementById('ios-close').onclick=()=>{document.getElementById('ios-hint').classList.remove('show');ls.set('ios-hint-dismissed','1');};
}

// ── Dates (local time, not UTC) ────────────────────────────────────────────────
function localDateStr(d=new Date()){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseLocal(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseLocal(s);d.setDate(d.getDate()+n);return localDateStr(d);}

function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function daysLeft(d){if(!d)return null;return Math.round((parseLocal(d)-parseLocal(todayStr))/86400000);}
function nowTime(){return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${m}/${day}/${y}`;}
function fmtShort(d){if(!d)return'';const n=daysLeft(d);if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'Yesterday';const dt=parseLocal(d);const wd=dt.toLocaleDateString('en-US',{weekday:'short'});return(n>1&&n<7)?wd:`${wd} ${dt.getMonth()+1}/${dt.getDate()}`;}
function badge(label,colors,size='sm'){const p=size==='sm'?'2px 8px':'3px 10px';const fs=size==='sm'?'11px':'12px';return`<span style="background:${colors.bg};color:${colors.text};border-radius:99px;padding:${p};font-size:${fs};font-weight:600;white-space:nowrap;display:inline-block;">${esc(label)}</span>`;}

// ── Lanes: keep board column, status and done flag consistent ──────────────────
function laneForDue(d){if(!d)return'backlog';if(d<=todayStr)return'today';if(d<=addDays(todayStr,6))return'week';return'backlog';}
function deriveLane(t){
  if(t.done||t.status==='Complete')return'done';
  if(t.status==='Waiting'||t.status==='Blocked')return'waiting';
  if(t.status==='In Progress')return'today';
  return laneForDue(t.dueDate);
}
function normalizeTask(src){
  const t={...src};
  if(!CATEGORIES.includes(t.category))t.category=t.category||'Admin';
  if(!PRIORITIES.includes(t.priority))t.priority='Medium';
  if(!STATUSES.includes(t.status))t.status='Not Started';
  if(!REPEAT_IDS.includes(t.repeat))t.repeat='none';
  if(!LANE_IDS.includes(t.lane))t.lane=deriveLane(t);
  if(t.done||t.status==='Complete'){t.done=true;t.status='Complete';t.lane='done';t.completedAt=t.completedAt||todayStr;}
  else if(t.lane==='done'){t.lane=deriveLane({...t,lane:undefined});}
  if(t.lane!=='done'){t.done=false;t.completedAt=null;}
  delete t.asanaGid; // Asana removed
  return t;
}
function normalizeAll(arr){return assignOrders((arr||[]).map(normalizeTask));}
// ── Manual card order within a lane ────────────────────────────────────────────
const PRI_ORD={High:0,Medium:1,Low:2};
function autoSort(arr){
  return arr.slice().sort((a,b)=>{
    const oa=isOverdue(a.dueDate,a.status)?0:1,ob=isOverdue(b.dueDate,b.status)?0:1;if(oa!==ob)return oa-ob;
    const p=(PRI_ORD[a.priority]??1)-(PRI_ORD[b.priority]??1);if(p)return p;
    const da=a.dueDate||'9999',db=b.dueDate||'9999';if(da!==db)return da<db?-1:1;
    return String(a.description).localeCompare(String(b.description));
  });
}
const hasOrder=t=>typeof t.order==='number'&&isFinite(t.order);
// Cards without a saved position (older cards, imported cards) get one, in the old auto-sort order
function assignOrders(tasks){
  const byLane={};tasks.forEach(t=>{(byLane[t.lane]=byLane[t.lane]||[]).push(t);});
  Object.values(byLane).forEach(arr=>{
    const missing=arr.filter(t=>!hasOrder(t));if(!missing.length)return;
    let max=Math.max(0,...arr.filter(hasOrder).map(t=>t.order));
    autoSort(missing).forEach(t=>{max+=1000;t.order=max;});
  });
  return tasks;
}
function laneTasks(lane,excludeId){return state.tasks.filter(t=>t.lane===lane&&String(t.id)!==String(excludeId));}
function topOrder(lane,excludeId){const o=laneTasks(lane,excludeId).filter(hasOrder).map(t=>t.order);return o.length?Math.min(...o)-1000:1000;}
function renumberLane(lane){laneTasks(lane).sort((a,b)=>a.order-b.order).forEach((t,i)=>{t.order=(i+1)*1000;});}
// Order value for dropping card `id` at position `index` of the lane as currently shown (respects filters)
function orderAt(lane,id,index){
  if(lane==='done'||index==null)return topOrder(lane,id);
  const calc=()=>{
    const list=sortLane(lane,laneTasks(lane,id).filter(matches));
    const before=list[index-1],after=list[index];
    if(!before&&!after)return{v:topOrder(lane,id)};
    if(!before)return{v:after.order-1000};
    if(!after)return{v:before.order+1000};
    return{v:(before.order+after.order)/2,gap:after.order-before.order};
  };
  let r=calc();
  if(r.gap!==undefined&&r.gap<0.001){renumberLane(lane);r=calc();}
  return r.v;
}
function applyLane(t,lane){
  const u={...t,lane};
  if(lane==='done'){u.done=true;u.status='Complete';u.completedAt=t.completedAt||todayStr;return u;}
  if(t.done){u.done=false;u.completedAt=null;u.status='Not Started';}
  if(lane==='waiting'){if(u.status!=='Waiting'&&u.status!=='Blocked')u.status='Waiting';}
  else if(u.status==='Waiting'||u.status==='Blocked')u.status='Not Started';
  return u;
}
// Repeating cards: when one is finished, the next one is created automatically
function nextDue(base,rep){
  if(!REPEAT_IDS.includes(rep)||rep==='none')return null;
  const step=x=>{if(rep==='daily')return addDays(x,1);if(rep==='weekly')return addDays(x,7);if(rep==='monthly')return addMonths(x,1);let y=addDays(x,1);while([0,6].includes(parseLocal(y).getDay()))y=addDays(y,1);return y;};
  let n=base||todayStr,guard=0;
  do{n=step(n);guard++;}while(n<=todayStr&&guard<1000);
  return n;
}
function spawnRepeat(t){
  if(!t.repeat||t.repeat==='none'||t.spawnedNext)return null;
  const due=nextDue(t.dueDate,t.repeat);if(!due)return null;
  return normalizeTask({id:uid(),category:t.category,description:t.description,job:t.job,priority:t.priority,dueDate:due,status:'Not Started',notes:t.notes,done:false,repeat:t.repeat,lane:laneForDue(due)});
}

function cloudOn(){return !!(cloud.user&&cloud.ready);}
function stableStr(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return'['+v.map(stableStr).join(',')+']';return'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';}
function cleanDoc(x){const o=JSON.parse(JSON.stringify(x));o.id=String(x.id);return o;} // Firestore can't store undefined
function collRef(c){return cloud.base.collection(c);}
async function commitOps(ops){
  // Firestore batches max out at 500 writes; chunk to be safe
  for(let i=0;i<ops.length;i+=400){
    const b=cloud.db.batch();
    ops.slice(i,i+400).forEach(([kind,ref,data])=>kind==='set'?b.set(ref,data):b.delete(ref));
    cloud.pending++;renderSoon();
    try{await b.commit();cloud.error='';}
    catch(e){cloud.error=e.message||String(e);console.warn('Cloud save failed',e);}
    finally{cloud.pending--;renderSoon();}
  }
}
function logEntry(t){return{id:String(t.id),description:t.description||'',category:t.category||'',job:t.job||'',priority:t.priority||'',notes:t.notes||'',completedAt:t.completedAt||todayStr,done:true,status:'Complete',sourceKey:t.sourceKey||''};}
// Compare current state to what the cloud last had and write only the differences
function cloudWrite(){
  if(!cloudOn())return;
  const ops=[];
  COLLS.forEach(c=>{
    const cur=new Map(state[c].map(x=>{const d=cleanDoc(x);return[d.id,d];}));
    const prev=cloud.synced[c];
    const next=new Map();
    cur.forEach((d,id)=>{const s=stableStr(d);next.set(id,s);if(prev.get(id)!==s)ops.push(['set',collRef(c).doc(id),d]);});
    prev.forEach((_,id)=>{if(!cur.has(id))ops.push(['delete',collRef(c).doc(id)]);});
    cloud.synced[c]=next;
  });
  state.tasks.forEach(t=>{const id=String(t.id);if(t.done&&!cloud.logged.has(id)){cloud.logged.add(id);ops.push(['set',collRef('completedLog').doc(id),logEntry(t)]);}});
  if(ops.length)commitOps(ops);
}
async function cloudCompletedLog(){if(!cloudOn())return[];try{const s=await collRef('completedLog').get();return s.docs.map(d=>d.data());}catch{return[];}}
const byIdDesc=(a,b)=>{const na=Number(a.id),nb=Number(b.id);return(isFinite(nb)&&isFinite(na))?nb-na:String(b.id).localeCompare(String(a.id));};
function applyRemote(c,snap){
  let items=snap.docs.map(d=>d.data());
  cloud.synced[c]=new Map(items.map(x=>[String(x.id),stableStr(cleanDoc(x))]));
  if(c==='tasks')items=normalizeAll(items);else if(c==='projects')items=normalizeProjects(items);else items.sort(byIdDesc);
  state[c]=items;
  cloud.loaded[c]=true;
  if(!cloud.ready&&COLLS.every(k=>cloud.loaded[k])){cloud.ready=true;}
  persist();
  if(cloud.ready)cloudWrite(); // pushes anything normalization changed (e.g. card positions)
  renderSoon(true);
}
async function linkDevice(user){
  // First time this browser connects: upload its cards that aren't in the cloud yet
  const key='tt_fb_linked_'+user.uid;
  if(ls.get(key))return;
  const snaps=await Promise.all(COLLS.map(c=>collRef(c).get()));
  const ops=[];let n=0;
  COLLS.forEach((c,i)=>{
    const have=new Set(snaps[i].docs.map(d=>d.id));
    (state[c]||[]).filter(x=>!x.sample).forEach(x=>{const d=cleanDoc(c==='tasks'?normalizeTask(x):x);if(!have.has(d.id)){ops.push(['set',collRef(c).doc(d.id),d]);if(c==='tasks')n++;}});
  });
  state.tasks.filter(t=>t.done&&!t.sample).forEach(t=>ops.push(['set',collRef('completedLog').doc(String(t.id)),logEntry(t)]));
  if(ops.length)await commitOps(ops);
  ls.set(key,'1');
  if(n)toast(`☁ Uploaded ${n} card${n!==1?'s':''} from this device to the cloud`);
}
async function onSignedIn(user){
  cloud.user=user;cloud.base=cloud.db.collection('users').doc(user.uid);

function timerLeft(){return ftimer.end?(ftimer.end-Date.now())/1000:ftimer.left;}
function chime(){
  try{const C=window.AudioContext||window.webkitAudioContext;const ac=new C();[660,880,990].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*0.25;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);o.start(t);o.stop(t+0.25);});}catch{}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch{}
}
setInterval(()=>{
  if(!ftimer.end){if(document.title!=='Task Tracker')document.title='Task Tracker';return;}
  const l=timerLeft();const el=document.getElementById('fm-time');if(el)el.textContent=fmtClock(l);
  document.title=`${fmtClock(l)} · Focus`;
  if(l<=0){ftimer.end=null;ftimer.left=ftimer.dur;document.title='Task Tracker';chime();toast('⏰ Time’s up — nice focus session. Take a short break.');}
},500);
window.fmTimer=(act,min)=>{
  if(act==='set'){ftimer.dur=min*60;ftimer.left=min*60;ftimer.end=null;}
  else if(act==='start'){ftimer.end=Date.now()+timerLeft()*1000;}
  else if(act==='pause'){ftimer.left=timerLeft();ftimer.end=null;}
  else if(act==='reset'){ftimer.end=null;ftimer.left=ftimer.dur;}
  render();
};
window.enterFocus=()=>{ls.set('tt_focusmode','1');setState({focusMode:true,modal:null});window.scrollTo(0,0);};
window.exitFocus=()=>{ls.del('tt_focusmode');setState({focusMode:false});};
window.fmDone=id=>{const hadRepeat=findTask(id)?.repeat&&findTask(id).repeat!=='none';toggleDone(id);if(!hadRepeat){const n=state.tasks.filter(t=>t.done&&t.completedAt===todayStr).length;toast(`✓ Done! ${n} finished today`);}};
window.fmLater=id=>{const o=laneTasks('today',id).filter(hasOrder).map(t=>t.order);const max=o.length?Math.max(...o):0;setState({tasks:state.tasks.map(t=>String(t.id)===String(id)?{...t,order:max+1000}:t)});};
window.fmNow=id=>{const o=topOrder('today',id);setState({tasks:state.tasks.map(t=>String(t.id)===String(id)?{...t,order:o}:t)});window.scrollTo(0,0);};
window.fmWait=id=>{moveTask(id,'waiting');toast('Moved to Waiting');};
window.fmToToday=id=>{moveTask(id,'today');};
function buildFocus(){
  const list=sortLane('today',state.tasks.filter(t=>t.lane==='today'&&!t.done));
  const cur=list[0],next=list.slice(1);
  const doneToday=state.tasks.filter(t=>t.done&&t.completedAt===todayStr).length;
  const running=!!ftimer.end;
  const presets=[15,25,50].map(m=>`<button class="fm-tbtn${ftimer.dur===m*60?' on':''}" onclick="fmTimer('set',${m})"${running?' disabled':''}>${m}m</button>`).join('');
  const timer=`<div class="fm-timer">${presets}<span id="fm-time" class="fm-time">${fmtClock(timerLeft())}</span>${running?`<button class="fm-tbtn" onclick="fmTimer('pause')">❚❚ Pause</button>`:`<button class="fm-tbtn on" onclick="fmTimer('start')">▶ Start</button>`}<button class="fm-tbtn" onclick="fmTimer('reset')" title="Reset timer">↺</button></div>`;
  const top=`<div class="fm-top"><div class="fm-top-in"><div><div class="fm-title">🎯 Focus</div><div class="fm-sub">${list.length} left in Today · ${doneToday} done today</div></div>${timer}<button class="fm-exit" onclick="exitFocus()">Exit</button></div></div>`;
  const pills=t=>{const cc=CAT_COLORS[t.category]||CAT_COLORS.Admin;const over=isOverdue(t.dueDate,t.status);return`<span class="pill" style="background:${cc.bg};color:${cc.text};">${esc(t.category)}</span>${t.priority==='High'?`<span class="pill" style="background:#FEE2E2;color:#B91C1C;">High</span>`:''}${t.dueDate?`<span class="pill" style="background:${over?'#FEE2E2':'#F1F5F9'};color:${over?'#B91C1C':'#334155'};">${over?'Overdue · ':''}${esc(fmtShort(t.dueDate))}</span>`:''}${t.repeat&&t.repeat!=='none'?`<span class="pill" style="background:#EEF2FF;color:#4338CA;">↻ ${esc(t.repeat)}</span>`:''}`;};
  const addBox=`<form class="qa" style="padding:0;margin-top:10px;" onsubmit="quickAdd(event,'today')"><input id="qa-today" name="q" autocomplete="off" placeholder="+ Add something to Today"></form>`;
  let body;
  if(cur){
    const id=esc(String(cur.id));const cc=CAT_COLORS[cur.category]||CAT_COLORS.Admin;
    body=`<div class="fm-label">Now</div>
    <div class="fm-now" style="--cat:${cc.dot};">
      <div class="fm-meta">${pills(cur)}</div>
      <h1 onclick="openTask('${id}')" title="Tap to edit">${esc(cur.description)}</h1>
      ${cur.job?`<div class="fm-job">${esc(cur.job)}</div>`:''}
      ${cur.notes?`<div class="fm-notes">${esc(cur.notes)}</div>`:''}
      <div class="fm-actions">
        <button class="fm-done" onclick="fmDone('${id}')">✓ Done</button>
        <button class="fm-sec" onclick="fmLater('${id}')" title="Send to the end of Today">↓ Later today</button>
        <button class="fm-sec" onclick="fmWait('${id}')">⏸ Waiting on someone</button>
        <button class="fm-sec" onclick="openModalType('park')">🅿 Interrupted</button>
      </div>
    </div>
    <div class="fm-next"><div class="fm-label">Up next${next.length?` (${next.length})`:''}</div>
      ${next.map(t=>{const c=CAT_COLORS[t.category]||CAT_COLORS.Admin;const tid=esc(String(t.id));return`<div class="fm-item" style="--cat:${c.dot};"><span class="t" onclick="openTask('${tid}')">${esc(t.description)}</span>${t.dueDate?`<span class="d" style="${isOverdue(t.dueDate,t.status)?'color:#DC2626;':''}">${esc(fmtShort(t.dueDate))}</span>`:''}<button onclick="fmNow('${tid}')">Do now</button></div>`;}).join('')||`<div style="font-size:13px;color:#94A3B8;padding:4px 2px;">That’s the last one for today.</div>`}
      ${addBox}
    </div>`;
  }else{
    const week=sortLane('week',state.tasks.filter(t=>t.lane==='week'&&!t.done)).slice(0,8);
    body=`<div class="fm-empty"><div style="font-size:34px;">🎉</div><div style="font-size:20px;font-weight:800;margin:6px 0 4px;color:#111827;">Today is clear</div><div style="font-size:13.5px;color:#64748B;">${doneToday?`You finished ${doneToday} card${doneToday!==1?'s':''} today. `:''}Pull something in from This Week, or add a new one.</div></div>
    ${week.length?`<div class="fm-next"><div class="fm-label">From This Week</div>${week.map(t=>{const c=CAT_COLORS[t.category]||CAT_COLORS.Admin;const tid=esc(String(t.id));return`<div class="fm-item" style="--cat:${c.dot};"><span class="t" onclick="openTask('${tid}')">${esc(t.description)}</span>${t.dueDate?`<span class="d">${esc(fmtShort(t.dueDate))}</span>`:''}<button onclick="fmToToday('${tid}')">→ Today</button></div>`;}).join('')}</div>`:''}
    <div class="fm-next">${addBox}</div>`;
  }
  return`<div class="fm">${top}<div class="fm-body">${body}<div class="fm-stat">Tip: when something interrupts you, tap 🅿 so you can pick up right where you left off.</div></div></div>`;
}

// ── Render (keeps scroll position and focus between re-renders) ────────────────
let renderPending=false;
function render(){
  if((drag&&drag.active)||pjDrag){renderPending=true;return;} // don't rebuild the board mid-drag
  renderPending=false;
  const app=document.getElementById('app');
  const board=app.querySelector('.board');
  const boardScroll=board?board.scrollLeft:0;
  const colScroll={};app.querySelectorAll('.col-body').forEach(el=>colScroll[el.dataset.lane]=el.scrollTop);
  const ae=document.activeElement;const aeId=ae&&ae.id&&app.contains(ae)?ae.id:null;
  const caret=aeId&&ae.selectionStart!=null?ae.selectionStart:null;
  const winY=window.scrollY;
  app.innerHTML=buildApp();
  const nb=app.querySelector('.board');if(nb)nb.scrollLeft=boardScroll;
  app.querySelectorAll('.col-body').forEach(el=>{if(colScroll[el.dataset.lane]!=null)el.scrollTop=colScroll[el.dataset.lane];});
  const fid=state.refocus||aeId;state.refocus=null;
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(caret!=null&&fid===aeId&&el.setSelectionRange)try{el.setSelectionRange(caret,caret);}catch{}}}
  window.scrollTo(0,winY);
}

function buildApp(){
  if(state.showSettings)return buildSettingsPage();
  if(state.focusMode)return`${buildFocus()}${state.modal?buildModal():''}${state.toast?`<div id="toast">${esc(state.toast)}</div>`:''}`;
  const openParking=state.parking.filter(k=>!k.cleared);
  const open=state.tasks.filter(t=>!t.done);
  const counts={today:open.filter(t=>t.lane==='today').length,week:open.filter(t=>t.lane==='week').length,waiting:open.filter(t=>t.lane==='waiting').length,backlog:open.filter(t=>t.lane==='backlog').length,over:open.filter(t=>isOverdue(t.dueDate,t.status)).length};
  const wide=state.tab==='tasks';
  return`<div style="padding-bottom:env(safe-area-inset-bottom);">${buildHeader(counts,openParking.length)}<div class="wrap${wide?' wide':''}">${buildCloudNotice()}${state.tab==='tasks'?buildBoardTab(counts):''}${state.tab==='parking'?buildParkingTab(openParking):''}${state.tab==='pm'?buildPMTab():''}</div>${state.modal?buildModal():''}${state.toast?`<div id="toast">${esc(state.toast)}</div>`:''}</div>`;
}

function cloudStatus(){
  if(!cloud.available)return{label:'☁ Local only',color:'#6B7280',bg:'#F3F4F6'};
  if(!cloud.user)return{label:'☁ Not signed in — saved on this device only',color:'#A16207',bg:'#FEF9C3'};

// ── Board Tab ──────────────────────────────────────────────────────────────────
function matches(t){
  if(state.focus==='ops'&&t.category==='Marketing')return false;
  if(state.focus==='marketing'&&t.category!=='Marketing')return false;
  if(state.filterCat!=='All'&&t.category!==state.filterCat)return false;
  if(state.search&&!`${t.description} ${t.job} ${t.notes}`.toLowerCase().includes(state.search.toLowerCase()))return false;
  return true;
}
// Your order (drag to rearrange). Done is always newest-first.
function sortLane(lane,arr){
  if(lane==='done')return arr.slice().sort((a,b)=>String(b.completedAt||'').localeCompare(String(a.completedAt||''))||((b.order||0)-(a.order||0)));
  return arr.slice().sort((a,b)=>(a.order??0)-(b.order??0));
}
function buildBoardTab(counts){
  const openAll=state.tasks.filter(t=>!t.done&&(t.lane==='today'||t.lane==='week'));
  const mk=openAll.filter(t=>t.category==='Marketing').length;const ops=openAll.length-mk;
  const stats=[['Today',counts.today,'#2563EB'],['This Week',counts.week,'#1F2937'],['Waiting',counts.waiting,'#A16207'],['Overdue',counts.over,counts.over>0?'#DC2626':'#15803D'],['Ops · Mktg',`${ops}<span style="color:#CBD5E1;font-weight:600;"> · </span><span style="color:#0F766E;">${mk}</span>`,'#1F2937']].map(([l,v,c])=>`<div class="stat"><b style="color:${c};">${v}</b><span>${l}</span></div>`).join('');
  const dueNow=state.tasks.filter(t=>!t.done&&(t.lane==='backlog'||t.lane==='week')&&t.dueDate&&t.dueDate<=todayStr);
  const nudge=dueNow.length?`<div class="nudge">📌 ${dueNow.length} card${dueNow.length>1?'s are':' is'} due today or overdue but still in Backlog / This Week.<button onclick="pullDueIntoToday()">Move to Today</button></div>`:'';
  const focusSeg=`<div class="seg">${[['all','All'],['ops','Ops'],['marketing','Marketing']].map(([id,l])=>`<button class="${state.focus===id?'on':''}" onclick="setFocus('${id}')">${l}</button>`).join('')}</div>`;
  const viewSeg=`<div class="seg" title="Board layout">${[['rows','☰ Rows'],['columns','▥ Columns']].map(([id,l])=>`<button class="${state.layout===id?'on':''}" onclick="setLayout('${id}')">${l}</button>`).join('')}</div>`;
  const catSel=`<select onchange="setFilterCat(this.value)" aria-label="Category"><option value="All">All categories</option>${CATEGORIES.map(c=>`<option value="${esc(c)}"${state.filterCat===c?' selected':''}>${esc(c)}</option>`).join('')}</select>`;
  const toolbar=`<div class="toolbar"><button class="fm-enter" onclick="enterFocus()" title="One card at a time from Today, with a focus timer">🎯 Focus</button><input id="search" type="search" value="${esc(state.search)}" oninput="setSearch(this.value)" placeholder="Search cards…">${focusSeg}${catSel}${viewSeg}</div>`;
  const cols=LANES.map(l=>buildColumn(l)).join('');
  return`<div class="stats">${stats}</div>${nudge}${toolbar}<div class="board${state.layout==='rows'?' rows':''}">${cols}</div>`;
}
function buildColumn(l){
  const all=state.tasks.filter(t=>t.lane===l.id);
  let items=sortLane(l.id,all.filter(matches));
  let more='';
  if(l.id==='done'){
    const cap=15;
    if(!state.doneShowAll&&items.length>cap){more=`<button class="show-more" onclick="setState({doneShowAll:true})">Show all ${items.length}</button>`;items=items.slice(0,cap);}
  }
  const qa=l.id==='done'?'':`<form class="qa" onsubmit="quickAdd(event,'${l.id}')"><input id="qa-${l.id}" name="q" autocomplete="off" placeholder="+ Add a card"></form>`;
  const clearBtn=l.id==='done'&&all.length?`<button onclick="archiveCompleted()" style="margin-left:auto;border:none;background:none;color:#64748B;font-size:11px;font-weight:700;">Clear →</button>`:'';
  const collapsed=!!state.collapsed[l.id];
  const tog=`<button class="tog" onclick="toggleLane('${l.id}')" aria-label="${collapsed?'Expand':'Collapse'} ${l.label}" title="${collapsed?'Expand':'Collapse'}">${collapsed?'▸':'▾'}</button>`;
  return`<section class="col${collapsed?' collapsed':''}" data-lane="${l.id}">
    <div class="col-side">
      <div class="col-head">${tog}<h2>${l.label}</h2><span class="n">${all.length}</span>${clearBtn}</div>
      ${l.hint?`<div class="col-hint">${l.hint}</div>`:''}
      ${qa}
    </div>

// ── Drag and drop ──────────────────────────────────────────────────────────────
// Works with mouse (press and drag) and touch (press and hold ~¼ sec, then drag).
let drag=null,suppressClick=false;

function placePh(body,x,y){
  const lane=body.dataset.lane;
  if(lane==='done'){body.insertBefore(drag.ph,body.firstChild);return;}
  const cards=cardsIn(body);
  let target=null;
  for(const c of cards){
    const r=c.getBoundingClientRect();
    const single=r.width>body.clientWidth*0.6; // one card per line → compare vertically only
    const before=single?(y<r.top+r.height/2):(y<r.top||(y<=r.bottom&&x<r.left+r.width/2));
    if(before){target=c;break;}
  }
  if(target){if(drag.ph.nextSibling!==target)body.insertBefore(drag.ph,target);}

function activateDrag(x,y){

document.addEventListener('pointerdown',e=>{

// ── Import (paste text / email, or a CSV / Excel file) ─────────────────────────
const CAT_ALIASES={service:'Service Calendar',calendar:'Service Calendar',svc:'Service Calendar',sub:'Subcontractor',subs:'Subcontractor',subcontractor:'Subcontractor',large:'Large Project',project:'Large Project',lp:'Large Project',materials:'Materials/Orders',material:'Materials/Orders',mat:'Materials/Orders',order:'Materials/Orders',orders:'Materials/Orders',followup:'Customer Follow-up',fu:'Customer Follow-up',customer:'Customer Follow-up',cust:'Customer Follow-up',pm:'PM Check-in',checkin:'PM Check-in',admin:'Admin',marketing:'Marketing',mkt:'Marketing',mktg:'Marketing'};

// One line → card fields. Tags: #today #week #backlog #waiting · !high !low (or !!) · @materials @followup @pm … · due:fri due:9/30 due:+3 · *weekly · [Customer / Job #] · // notes
function parseQuickLine(raw,def){

  line=line.replace(/(^|\s)#([a-z]+)(?=\s|$)/gi,(m,sp,v)=>{const l=LANE_TAGS[v.toLowerCase()];if(l){o.lane=l;return' ';}return m;});

// A pasted email → one card: subject = title, sender = job/customer, body = notes
function parseEmail(text,def){

    const m=l.match(/^\s*(From|Sent|To|Cc|Bcc|Subject|Date|Reply-To)\s*:\s*(.*)$/i);
    if(m){const k=m[1].toLowerCase();if(k==='subject'&&!subject)subject=m[2].trim();if(k==='from'&&!from)from=m[2].trim();return;}
    body.push(l);

  const p=parseQuickLine(subject.slice(0,200),def);if(!p)return null;
  const fromName=from.replace(/<([^>]*)>/,'').replace(/["']/g,'').trim()||((from.match(/<([^>]*)>/)||[])[1]||'');

function parseCSV(text){

    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=ch;
  }

const normH=h=>String(h||'').toLowerCase().replace(/[^a-z0-9]/g,'');

window.impFile=async input=>{

// Reorder: `index` = drop position among the active projects (excluding the one being moved)
function moveProject(id,index){
  const calc=()=>{
    const list=activeProjects().filter(p=>String(p.id)!==String(id));
    const before=list[index-1],after=list[index];
    if(!before&&!after)return{v:1000};if(!before)return{v:after.order-1000};if(!after)return{v:before.order+1000};
    return{v:(before.order+after.order)/2,gap:after.order-before.order};
  };
  let r=calc();
  if(r.gap!==undefined&&r.gap<0.001){state.projects=state.projects.map((p,i)=>({...p,order:(i+1)*1000}));r=calc();}
  setState({projects:state.projects.map(p=>String(p.id)===String(id)?{...p,order:r.v}:p)});
}
let pjDrag=null;
function movePj(y){
  const d=pjDrag;d.y=y;d.ghost.style.transform=`translate(${d.left}px,${y-d.offY}px)`;
  const rows=[...d.list.querySelectorAll(':scope > .pj')].filter(x=>x!==d.row);
  let target=null;for(const r of rows){const b=r.getBoundingClientRect();if(y<b.top+b.height/2){target=r;break;}}
  if(target){if(d.ph.nextSibling!==target)d.list.insertBefore(d.ph,target);}else if(d.list.lastChild!==d.ph)d.list.appendChild(d.ph);
}
function endPj(commit){
  const d=pjDrag;if(!d)return;pjDrag=null;
  cancelAnimationFrame(d.raf);document.body.classList.remove('is-dragging');d.ghost.remove();
  const idx=[...d.list.children].filter(c=>c===d.ph||(c.classList.contains('pj')&&c!==d.row)).indexOf(d.ph);
  d.ph.remove();d.row.style.display='';
  suppressClick=true;setTimeout(()=>suppressClick=false,50);
  if(commit&&idx>=0)moveProject(d.id,idx);else render();
  if(renderPending)render();
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('.pj-handle:not(.off)');if(!h||state.modal)return;
  const row=h.closest('.pj');if(!row)return;
  e.preventDefault();
  const r=row.getBoundingClientRect();
  const ghost=row.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';ghost.querySelectorAll('[onclick]').forEach(x=>x.removeAttribute('onclick'));document.body.appendChild(ghost);
  const ph=document.createElement('div');ph.className='pj-ph';ph.style.height=r.height+'px';
  row.parentNode.insertBefore(ph,row);row.style.display='none';
  pjDrag={id:row.dataset.pid,row,ghost,ph,offY:e.clientY-r.top,left:r.left,list:row.parentNode,y:e.clientY};
  document.body.classList.add('is-dragging');
  if(e.pointerType!=='mouse'&&navigator.vibrate)try{navigator.vibrate(10);}catch{}
  movePj(e.clientY);
  const loop=()=>{if(!pjDrag)return;const y=pjDrag.y,vh=window.innerHeight;if(y<130)window.scrollBy(0,-Math.ceil((130-y)/5));else if(y>vh-70)window.scrollBy(0,Math.ceil((y-(vh-70))/5));movePj(y);pjDrag.raf=requestAnimationFrame(loop);};
  pjDrag.raf=requestAnimationFrame(loop);
});
document.addEventListener('pointermove',e=>{if(pjDrag){e.preventDefault();movePj(e.clientY);}});
document.addEventListener('touchmove',e=>{if(pjDrag)e.preventDefault();},{passive:false});
document.addEventListener('pointerup',()=>endPj(true));
document.addEventListener('pointercancel',()=>endPj(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pjDrag)endPj(false);});

window.submitTaskForm=(e,id)=>{
  e.preventDefault();const fd=new FormData(e.target);
  const prev=id?findTask(id):null;
  const description=String(fd.get('description')||'').trim();if(!description)return;
  let lane=fd.get('lane'),status=fd.get('status');
  const laneChanged=!prev||prev.lane!==lane;
  const statusChanged=!prev||prev.status!==status;
  // Keep status and column in step
  const isWait=s=>s==='Waiting'||s==='Blocked';
  if(statusChanged&&!laneChanged){
    // Status was changed → move the card to match
    if(status==='Complete')lane='done';
    else if(isWait(status))lane='waiting';
    else if(lane==='waiting'||lane==='done')lane=deriveLane({status,dueDate:fd.get('dueDate')||''});
  }else{
    // Column was changed (or both) → column wins, status follows
    if(lane==='done')status='Complete';
    else if(lane==='waiting'){if(!isWait(status))status='Waiting';}
    else if(isWait(status)||status==='Complete')status='Not Started';
  }
  let task={...(prev||{}),id:id||uid(),category:fd.get('category'),description,job:fd.get('job'),priority:fd.get('priority'),dueDate:fd.get('dueDate')||'',status,notes:fd.get('notes'),lane,repeat:fd.get('repeat')||'none',done:lane==='done',completedAt:lane==='done'?((prev&&prev.completedAt)||todayStr):null,sample:undefined};
  if(lane==='waiting'&&status!=='Waiting'&&status!=='Blocked')task.status='Waiting';
  task=normalizeTask(task);
  if(!prev||prev.lane!==task.lane)task.order=topOrder(task.lane,task.id); // new or moved → top of its lane
  let spawned=null;
  if(task.done&&!(prev&&prev.done)){spawned=spawnRepeat(task);if(spawned){task.spawnedNext=true;spawned.order=topOrder(spawned.lane);}}
  let tasks=id?state.tasks.map(t=>String(t.id)===String(id)?task:t):[task,...state.tasks];
  if(spawned)tasks=[spawned,...tasks];
  setState({tasks,modal:null});
  if(spawned)toast(`↻ Next one added to ${laneLabel(spawned.lane)} — due ${fmtShort(spawned.dueDate)}`);
};
window.submitParkForm=e=>{e.preventDefault();const fd=new FormData(e.target);setState({parking:[{id:Date.now(),time:nowTime(),wasWorkingOn:fd.get('wasWorkingOn'),interruption:fd.get('interruption'),nextStep:fd.get('nextStep'),priority:window._parkPri||'Medium',cleared:false},...state.parking],modal:null});window._parkPri=null;};
